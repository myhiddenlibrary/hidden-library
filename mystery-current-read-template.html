<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Reading Tracker — Mystery & Thriller</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #eee; min-height: 100vh; }
#app { display: flex; min-height: 100vh; }
#panel { width: 250px; min-width: 220px; padding: 14px; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px; background: #111111; overflow-y: auto; }
#canvas-outer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0a0a0a; }
#canvas-wrap { position: relative; width: 380px; height: 280px; border-radius: 24px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 48px rgba(0,0,0,0.8); transition: all 0.4s ease; }
#bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 24px; }
#main-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px; }
body.preview-mode #panel { display: none; }
body.preview-mode #canvas-outer { background: #000; padding: 0; }
body.preview-mode #canvas-wrap { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
body.preview-mode #preview-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; opacity: 0.2; font-size: 10px; padding: 6px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; color: white; cursor: pointer; width: auto; }
body.preview-mode #preview-btn:hover { opacity: 0.8; }
label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
input[type=text], select { width: 100%; font-size: 12px; padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #eee; }
input[type=range] { width: 100%; accent-color: #60a0c0; }
.row { display: flex; gap: 8px; align-items: center; }
.pct-val { font-size: 12px; font-weight: 500; min-width: 36px; color: #eee; }
button { font-size: 11px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 8px; background: rgba(255,255,255,0.06); color: #eee; cursor: pointer; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button:hover { background: rgba(255,255,255,0.12); }
.sec { font-size: 10px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
.size-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.sz { font-size: 10px; padding: 6px 4px; line-height: 1.3; text-align: center; white-space: normal; }
.sz.active { background: rgba(96,160,192,0.25); color: #60a0c0; border-color: #60a0c0; }
.dl-btn { background: rgba(96,160,192,0.2) !important; color: #60a0c0 !important; border-color: #60a0c0 !important; font-weight: 600; }
.hint { font-size: 10px; color: #666; text-align: center; line-height: 1.5; margin-top: 2px; }
#preview-btn { font-size: 10px; color: #444; background: none; border: none; cursor: pointer; width: auto; text-align: center; padding: 2px; letter-spacing: 0.5px; margin-top: 2px; }
#preview-btn:hover { color: #888; background: none; }
@media (max-width: 640px) {
  #app { flex-direction: column; }
  #panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
  #canvas-outer { padding: 16px; }
  #canvas-wrap { width: 100%; max-width: 380px; height: auto; aspect-ratio: 380/280; }
}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div style="font-size:14px;font-weight:700;color:#60a0c0;margin-bottom:4px;">🔍 Current Reading</div>
    <div class="sec">Book Info</div>
    <div><label>Title</label><input type="text" id="inp-title" value="The Silent Patient"></div>
    <div><label>Author</label><input type="text" id="inp-author" value="Alex Michaelides"></div>
    <div><label>Subgenre</label>
      <select id="inp-genre">
        <option value="psychological" selected>Psychological Thriller</option>
        <option value="crime">Crime Thriller</option>
        <option value="whodunnit">Whodunnit</option>
        <option value="police">Police Procedural</option>
        <option value="legal">Legal Thriller</option>
        <option value="medical">Medical Thriller</option>
        <option value="spy">Spy Thriller</option>
        <option value="cyber">Cyber Thriller</option>
        <option value="supernatural">Supernatural Thriller</option>
        <option value="historical">Historical Thriller</option>
        <option value="iyamisu">Iyamisu</option>
      </select>
    </div>
    <div><label>Reading Time</label><input type="text" id="inp-time" value="3 hrs"></div>
    <div><label>Progress</label>
      <div class="row">
        <input type="range" id="inp-pct" min="0" max="100" value="68" style="flex:1">
        <span class="pct-val" id="pct-label">68%</span>
      </div>
    </div>
    <div class="sec">Background</div>
    <button onclick="document.getElementById('file-in').click()">Upload image</button>
    <input type="file" id="file-in" accept="image/*" style="display:none">
    <button onclick="clearBg()">Reset to default</button>
    <div class="sec">Download</div>
    <div class="size-btns">
      <button class="sz active" onclick="setSize('landscape',this)">1080 x 566</button>
      <button class="sz" onclick="setSize('ig-post',this)">1080 x 1080</button>
      <button class="sz" onclick="setSize('ig-story',this)">1080 x 1920</button>
      <button class="sz" onclick="setSize('pinterest',this)">1000 x 1500</button>
    </div>
    <button class="dl-btn" onclick="downloadImg()">Download PNG</button>
    <div class="hint">Slide to 100% to reveal the ending! 🔦</div>
    <button id="preview-btn" onclick="togglePreview()">⛶ preview</button>
  </div>
  <div id="canvas-outer">
    <div id="canvas-wrap">
      <div id="bg-layer"></div>
      <div id="confetti-container"></div>
      <svg id="main-svg" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="red-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="title-clip"><rect x="10" y="8" width="165" height="120"/></clipPath>
        </defs>

        <!-- Map grid background lines (city street grid aesthetic) -->
        <g id="map-grid" opacity="0.13">
          <!-- horizontal lines -->
          <line x1="0" y1="60" x2="380" y2="60" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="0" y1="100" x2="380" y2="100" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="0" y1="140" x2="380" y2="140" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="0" y1="180" x2="380" y2="180" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="0" y1="220" x2="380" y2="220" stroke="#8899aa" stroke-width="0.6"/>
          <!-- vertical lines -->
          <line x1="60" y1="0" x2="60" y2="280" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="120" y1="0" x2="120" y2="280" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="180" y1="0" x2="180" y2="280" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="240" y1="0" x2="240" y2="280" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="300" y1="0" x2="300" y2="280" stroke="#8899aa" stroke-width="0.6"/>
          <line x1="340" y1="0" x2="340" y2="280" stroke="#8899aa" stroke-width="0.6"/>
          <!-- diagonal cross streets -->
          <line x1="0" y1="280" x2="380" y2="0" stroke="#8899aa" stroke-width="0.4"/>
          <line x1="0" y1="200" x2="280" y2="0" stroke="#8899aa" stroke-width="0.4"/>
          <line x1="80" y1="280" x2="380" y2="80" stroke="#8899aa" stroke-width="0.4"/>
        </g>

        <!-- City block fills -->
        <g id="city-blocks" opacity="0.07">
          <rect x="62" y="102" width="56" height="36" rx="2" fill="#aabbcc"/>
          <rect x="122" y="62" width="56" height="36" rx="2" fill="#aabbcc"/>
          <rect x="182" y="102" width="56" height="36" rx="2" fill="#aabbcc"/>
          <rect x="242" y="62" width="56" height="36" rx="2" fill="#aabbcc"/>
          <rect x="302" y="102" width="36" height="36" rx="2" fill="#aabbcc"/>
          <rect x="62" y="142" width="56" height="36" rx="2" fill="#aabbcc"/>
          <rect x="122" y="142" width="56" height="36" rx="2" fill="#aabbcc"/>
          <rect x="182" y="142" width="56" height="36" rx="2" fill="#aabbcc"/>
        </g>

        <!-- Main path (road/route) -->
        <path id="road-border" d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-body" d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-dash" d="" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6 10" stroke-linecap="round"/>

        <!-- Start marker (crime scene pin style) -->
        <g transform="translate(28,245)">
          <circle cx="0" cy="0" r="7" fill="rgba(200,30,30,0.25)" stroke="rgba(200,30,30,0.7)" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="3" fill="rgba(220,50,50,0.9)"/>
          <text x="12" y="4" font-size="8" fill="rgba(255,255,255,0.55)" font-family="'Courier New',monospace">START</text>
        </g>

        <!-- End marker -->
        <g transform="translate(342,30)">
          <circle cx="0" cy="0" r="7" fill="rgba(255,220,50,0.2)" stroke="rgba(255,220,50,0.6)" stroke-width="1.2"/>
          <text x="0" y="3" font-size="8" fill="rgba(255,220,50,0.9)" font-family="'Courier New',monospace" text-anchor="middle">✓</text>
          <text x="12" y="4" font-size="8" fill="rgba(255,255,255,0.55)" font-family="'Courier New',monospace">END</text>
        </g>

        <!-- Compass rose (top right area) -->
        <g transform="translate(355,255)" opacity="0.18">
          <circle cx="0" cy="0" r="12" fill="none" stroke="#aab" stroke-width="0.8"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#aab" stroke-width="0.8"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#aab" stroke-width="0.8"/>
          <text x="0" y="-13" font-size="6" fill="#aab" text-anchor="middle" font-family="monospace">N</text>
        </g>

        <g clip-path="url(#title-clip)">
          <g id="title-group"></g>
          <text id="svg-author" x="16" y="999" font-family="'Courier New',Courier,monospace" font-size="11" font-style="italic" fill="rgba(255,255,255,0.75)">Alex Michaelides</text>
          <text id="svg-genre-label" x="16" y="999" font-family="'Courier New',Courier,monospace" font-size="9" fill="rgba(255,255,255,0.42)" font-style="italic">Psychological Thriller</text>
        </g>
        <text id="svg-time" x="295" y="195" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="600" fill="rgba(255,255,255,0.80)" text-anchor="middle" filter="url(#soft-glow)">3 hrs</text>
        <text id="svg-pct" x="295" y="250" font-family="'Courier New',Courier,monospace" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.96" filter="url(#soft-glow)">68%</text>
        <g id="marker-anchor"><g id="marker-sway"><g id="marker-group"></g></g></g>
      </svg>
    </div>
  </div>
</div>
<script>
// PATH: slightly different from romance — more jagged/angular, like navigating city streets
const PATH_D = "M 28 245 C 40 220, 60 210, 90 190 C 115 172, 120 148, 150 128 C 178 110, 210 108, 235 88 C 258 70, 300 48, 342 30";

const GENRES = {
  psychological: {
    roadTop: '#7060a0',
    bg: 'linear-gradient(135deg,#0d0a1a 0%,#1a1228 100%)',
    bgSolid: '#0d0a1a',
    genreLabel: 'Psychological Thriller',
    marker: drawDagger,
    accent: '#a080e0'
  },
  crime: {
    roadTop: '#a03030',
    bg: 'linear-gradient(135deg,#1a0a0a 0%,#2a1010 100%)',
    bgSolid: '#1a0a0a',
    genreLabel: 'Crime Thriller',
    marker: drawMagnifier,
    accent: '#e05050'
  },
  whodunnit: {
    roadTop: '#8a7040',
    bg: 'linear-gradient(135deg,#1a1508 0%,#251e0c 100%)',
    bgSolid: '#1a1508',
    genreLabel: 'Whodunnit',
    marker: drawPipe,
    accent: '#d4a840'
  },
  police: {
    roadTop: '#2060a0',
    bg: 'linear-gradient(135deg,#080e1a 0%,#0e1a2e 100%)',
    bgSolid: '#080e1a',
    genreLabel: 'Police Procedural',
    marker: drawBadge,
    accent: '#4090e0'
  },
  legal: {
    roadTop: '#507860',
    bg: 'linear-gradient(135deg,#0a140e 0%,#121e16 100%)',
    bgSolid: '#0a140e',
    genreLabel: 'Legal Thriller',
    marker: drawGavel,
    accent: '#70b890'
  },
  medical: {
    roadTop: '#308080',
    bg: 'linear-gradient(135deg,#071414 0%,#0f2020 100%)',
    bgSolid: '#071414',
    genreLabel: 'Medical Thriller',
    marker: drawSyringe,
    accent: '#40c0c0'
  },
  spy: {
    roadTop: '#506070',
    bg: 'linear-gradient(135deg,#0a0e12 0%,#141e26 100%)',
    bgSolid: '#0a0e12',
    genreLabel: 'Spy Thriller',
    marker: drawTarget,
    accent: '#80a0b8'
  },
  cyber: {
    roadTop: '#208060',
    bg: 'linear-gradient(135deg,#020d08 0%,#061a10 100%)',
    bgSolid: '#020d08',
    genreLabel: 'Cyber Thriller',
    marker: drawHack,
    accent: '#20e090'
  },
  supernatural: {
    roadTop: '#602880',
    bg: 'linear-gradient(135deg,#0d0214 0%,#180620 100%)',
    bgSolid: '#0d0214',
    genreLabel: 'Supernatural Thriller',
    marker: drawSkull,
    accent: '#c060e0'
  },
  historical: {
    roadTop: '#806040',
    bg: 'linear-gradient(135deg,#140e06 0%,#201608 100%)',
    bgSolid: '#140e06',
    genreLabel: 'Historical Thriller',
    marker: drawQuill,
    accent: '#c09060'
  },
  iyamisu: {
    roadTop: '#404858',
    bg: 'linear-gradient(135deg,#080a0e 0%,#10141a 100%)',
    bgSolid: '#080a0e',
    genreLabel: 'Iyamisu',
    marker: drawMask,
    accent: '#708090'
  }
};

// ── Cursor drawing functions (move along the path) ───────────────────────────
// Each cursor is oriented upward at rest; the sway rotates it naturally.
// "Footsteps" cursors leave a small shadow/trail below to suggest movement.

// Psychological Thriller → broken mirror shard / cracked glass cursor
function drawDagger(g) {
  g.innerHTML = `<g>
    <!-- Knife blade pointing up-forward -->
    <polygon points="0,-20 -2,-4 2,-4" fill="#ddd0ff" opacity="0.95"/>
    <polygon points="0,-20 -1,-4 0,-8" fill="#fff" opacity="0.5"/>
    <!-- Guard -->
    <rect x="-5" y="-4" width="10" height="2.5" rx="1" fill="#b090e0"/>
    <!-- Handle with wrap -->
    <rect x="-2.5" y="-1.5" width="5" height="11" rx="2" fill="#7050a0"/>
    <line x1="-2.5" y1="1" x2="2.5" y2="1" stroke="#9070c0" stroke-width="0.8" opacity="0.7"/>
    <line x1="-2.5" y1="3.5" x2="2.5" y2="3.5" stroke="#9070c0" stroke-width="0.8" opacity="0.7"/>
    <line x1="-2.5" y1="6" x2="2.5" y2="6" stroke="#9070c0" stroke-width="0.8" opacity="0.7"/>
    <!-- Pommel -->
    <ellipse cx="0" cy="9.5" rx="3" ry="2" fill="#9070c0"/>
    <!-- Blood drop -->
    <ellipse cx="0" cy="-21" rx="1.2" ry="1.5" fill="#ff4060" opacity="0.8"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="14" rx="4" ry="1.5" fill="rgba(180,100,255,0.18)"/>
  </g>`;
}

// Crime Thriller → magnifying glass cursor (detective following a trail)
function drawMagnifier(g) {
  g.innerHTML = `<g transform="rotate(35)">
    <!-- Handle -->
    <rect x="-2" y="4" width="4" height="14" rx="2" fill="#c04040"/>
    <rect x="-1" y="4" width="2" height="14" rx="1" fill="#e06060" opacity="0.5"/>
    <!-- Ring -->
    <circle cx="0" cy="0" r="9" fill="rgba(220,60,60,0.12)" stroke="#e05050" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6.5" fill="rgba(220,60,60,0.08)" stroke="#e05050" stroke-width="0.8" opacity="0.4"/>
    <!-- Crosshairs inside lens -->
    <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(255,100,100,0.5)" stroke-width="0.8"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="rgba(255,100,100,0.5)" stroke-width="0.8"/>
    <!-- Glare -->
    <ellipse cx="-3" cy="-3" rx="2" ry="1.2" fill="rgba(255,255,255,0.2)" transform="rotate(-30,-3,-3)"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="20" rx="4" ry="1.5" fill="rgba(220,60,60,0.18)"/>
  </g>`;
}

// Whodunnit → walking footsteps cursor (detective on the scene)
function drawPipe(g) {
  g.innerHTML = `<g>
    <!-- Left foot (back) -->
    <ellipse cx="-4" cy="6" rx="3.5" ry="5" fill="#b08830" opacity="0.55" transform="rotate(-15,-4,6)"/>
    <ellipse cx="-5.5" cy="3" rx="1.5" ry="2" fill="#b08830" opacity="0.45" transform="rotate(-15,-5.5,3)"/>
    <!-- Right foot (front, brighter = current step) -->
    <ellipse cx="4" cy="-4" rx="3.5" ry="5.5" fill="#d4a840" opacity="0.95" transform="rotate(15,4,-4)"/>
    <ellipse cx="5.5" cy="-8" rx="1.5" ry="2" fill="#d4a840" opacity="0.9" transform="rotate(15,5.5,-8)"/>
    <!-- Toe details on front foot -->
    <ellipse cx="3.5" cy="-9" rx="1" ry="0.7" fill="#e0bc50" opacity="0.6"/>
    <ellipse cx="5" cy="-9.5" rx="1" ry="0.7" fill="#e0bc50" opacity="0.6"/>
    <ellipse cx="6.5" cy="-9" rx="1" ry="0.7" fill="#e0bc50" opacity="0.6"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="13" rx="5" ry="1.8" fill="rgba(200,160,40,0.2)"/>
  </g>`;
}

// Police Procedural → police car / flasher cursor
function drawBadge(g) {
  g.innerHTML = `<g>
    <!-- Car body -->
    <rect x="-9" y="-4" width="18" height="11" rx="3" fill="#1a3a6a"/>
    <rect x="-9" y="-4" width="18" height="11" rx="3" fill="none" stroke="#3060a0" stroke-width="1"/>
    <!-- Cabin -->
    <rect x="-5" y="-12" width="10" height="9" rx="2" fill="#243a6a"/>
    <rect x="-5" y="-12" width="10" height="9" rx="2" fill="none" stroke="#3060a0" stroke-width="0.8"/>
    <!-- Windows -->
    <rect x="-4" y="-11" width="3.5" height="5" rx="1" fill="rgba(180,220,255,0.35)"/>
    <rect x="0.5" y="-11" width="3.5" height="5" rx="1" fill="rgba(180,220,255,0.35)"/>
    <!-- Light bar -->
    <rect x="-4" y="-15" width="8" height="3" rx="1.5" fill="#222"/>
    <rect x="-4" y="-15" width="4" height="3" rx="1.5" fill="#ff2020" opacity="0.9"/>
    <rect x="0" y="-15" width="4" height="3" rx="1.5" fill="#2060ff" opacity="0.9"/>
    <!-- Wheels -->
    <circle cx="-6" cy="7" r="3" fill="#111" stroke="#4060a0" stroke-width="1"/>
    <circle cx="6" cy="7" r="3" fill="#111" stroke="#4060a0" stroke-width="1"/>
    <circle cx="-6" cy="7" r="1.2" fill="#3060a0"/>
    <circle cx="6" cy="7" r="1.2" fill="#3060a0"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="11" rx="10" ry="2" fill="rgba(50,100,200,0.2)"/>
  </g>`;
}

// Legal Thriller → scales of justice cursor
function drawGavel(g) {
  g.innerHTML = `<g>
    <!-- Beam -->
    <rect x="-13" y="-1" width="26" height="2.5" rx="1.2" fill="#80b890"/>
    <!-- Pivot post -->
    <rect x="-1" y="-1" width="2" height="14" rx="1" fill="#70a880"/>
    <circle cx="0" cy="-1.5" r="2.5" fill="#90c0a0"/>
    <!-- Left pan (heavier - tilted) -->
    <line x1="-12" y1="1" x2="-10" y2="8" stroke="#70a880" stroke-width="1" stroke-linecap="round"/>
    <line x1="-12" y1="1" x2="-14" y2="8" stroke="#70a880" stroke-width="1" stroke-linecap="round"/>
    <path d="M-16,8 Q-12,11 -8,8" fill="rgba(112,168,128,0.3)" stroke="#80b890" stroke-width="1.2"/>
    <!-- Right pan -->
    <line x1="12" y1="1" x2="10" y2="5" stroke="#70a880" stroke-width="1" stroke-linecap="round"/>
    <line x1="12" y1="1" x2="14" y2="5" stroke="#70a880" stroke-width="1" stroke-linecap="round"/>
    <path d="M-16,5 Q-12,8 -8,5" fill="rgba(112,168,128,0.3)" stroke="#80b890" stroke-width="1.2" transform="translate(24,0)"/>
    <!-- Base -->
    <rect x="-4" y="12" width="8" height="2" rx="1" fill="#70a880"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="16" rx="7" ry="1.5" fill="rgba(100,180,120,0.18)"/>
  </g>`;
}

// Medical Thriller → syringe/needle cursor moving like an injection
function drawSyringe(g) {
  g.innerHTML = `<g transform="rotate(-45)">
    <!-- Needle tip -->
    <polygon points="0,-20 -1,-15 1,-15" fill="#80e0e0"/>

// ── Core functions ────────────────────────────────────────────────────────────

let pct = 68, currentSize = 'landscape', bgImage = null, celebrating = false, swayAnim = null, isPreview = false;

function getSVGPath() {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', PATH_D);
  return p;
}
function ptAt(t) {
  const p = getSVGPath();
  return p.getPointAtLength(p.getTotalLength() * Math.min(Math.max(t, 0), 1));
}
function togglePreview() {
  isPreview = !isPreview;
  document.body.classList.toggle('preview-mode', isPreview);
  const btn = document.getElementById('preview-btn');
  if (isPreview) { document.body.appendChild(btn); btn.textContent = '✕ exit'; }
  else { document.getElementById('panel').appendChild(btn); btn.textContent = '⛶ preview'; }
}

function applyGenreTheme() {
  const G = GENRES[document.getElementById('inp-genre').value];
  if (!bgImage) {
    const wrap = document.getElementById('canvas-wrap');
    wrap.style.background = G.bg;
  }
  document.getElementById('road-border').setAttribute('stroke', 'rgba(0,0,0,0.5)');
  document.getElementById('road-border').setAttribute('stroke-width', '28');
  document.getElementById('road-border').setAttribute('d', PATH_D);
  document.getElementById('road-body').setAttribute('stroke', G.roadTop);
  document.getElementById('road-body').setAttribute('stroke-width', '20');
  document.getElementById('road-body').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('d', PATH_D);
  document.getElementById('svg-genre-label').textContent = G.genreLabel;

  // update map grid + city block colors to match accent
  document.querySelectorAll('#map-grid line').forEach(l => l.setAttribute('stroke', G.accent));
  document.querySelectorAll('#city-blocks rect').forEach(r => r.setAttribute('fill', G.accent));
}

function renderTitle(text) {
  const g = document.getElementById('title-group');
  g.innerHTML = '';
  const MAX_W = 158, MAX_FONT = 20, MIN_FONT = 12, LH = 1.28, START_Y = 28;
  const ns = 'http://www.w3.org/2000/svg';
  let chosenFont = MIN_FONT, chosenLines = [text];
  for (let fs = MAX_FONT; fs >= MIN_FONT; fs--) {
    const cpl = Math.floor(MAX_W / (fs * 0.56));
    const lines = wrapText(text, cpl);
    if (lines.length * fs * LH <= 54) { chosenFont = fs; chosenLines = lines; break; }
  }
  const el = document.createElementNS(ns, 'text');
  el.setAttribute('font-family', "'Courier New',Courier,monospace");
  el.setAttribute('font-size', chosenFont);
  el.setAttribute('font-weight', '700');
  el.setAttribute('fill', 'white');
  el.setAttribute('opacity', '0.96');
  el.setAttribute('filter', 'url(#soft-glow)');
  chosenLines.forEach((line, i) => {
    const ts = document.createElementNS(ns, 'tspan');
    ts.setAttribute('x', '16');
    ts.setAttribute('y', START_Y + i * chosenFont * LH);
    ts.textContent = line;
    el.appendChild(ts);
  });
  g.appendChild(el);
  return START_Y + (chosenLines.length - 1) * chosenFont * LH + chosenFont * 0.3;
}

function wrapText(text, cpl) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (t.length > cpl && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function updateTexts() {
  const titleText = document.getElementById('inp-title').value || 'Title';
  const authorText = document.getElementById('inp-author').value || 'Author';
  const genre = document.getElementById('inp-genre').value;
  const timeText = document.getElementById('inp-time').value || '';
  const bottomY = renderTitle(titleText);
  const authorEl = document.getElementById('svg-author');
  authorEl.setAttribute('y', bottomY + 18);
  authorEl.textContent = authorText;
  const genreEl = document.getElementById('svg-genre-label');
  genreEl.setAttribute('y', bottomY + 34);
  genreEl.textContent = GENRES[genre].genreLabel;
  document.getElementById('svg-time').textContent = timeText;
  document.getElementById('svg-pct').textContent = pct + '%';
}

function startSway() {
  if (swayAnim) cancelAnimationFrame(swayAnim);
  let t0 = null;
  const walkingCursors = ['whodunnit', 'spy', 'iyamisu'];
  const floatCursors = ['supernatural'];
  function frame(ts) {
    if (!t0) t0 = ts;
    const elapsed = (ts - t0) / 1000;
    const genre = document.getElementById('inp-genre').value;
    const sway = document.getElementById('marker-sway');
    if (walkingCursors.includes(genre)) {
      const bob = Math.sin(elapsed * 3.5) * 3;
      const tilt = Math.sin(elapsed * 3.5) * 8;
      sway.setAttribute('transform', `rotate(${tilt}) translate(0,${bob})`);
    } else if (floatCursors.includes(genre)) {
      const float = Math.sin(elapsed * 1.5) * 4;
      const wobble = Math.sin(elapsed * 0.9) * 4;
      sway.setAttribute('transform', `rotate(${wobble}) translate(0,${float})`);
    } else {
      sway.setAttribute('transform', `rotate(${Math.sin(elapsed * 1.2) * 6})`);
    }
    swayAnim = requestAnimationFrame(frame);
  }
  swayAnim = requestAnimationFrame(frame);
}

function placeMarker(scale = 1) {
  const pt = ptAt(pct / 100);
  document.getElementById('marker-anchor').setAttribute('transform', `translate(${pt.x},${pt.y})`);
  document.getElementById('marker-sway').setAttribute('transform', `scale(${scale})`);
  const g = document.getElementById('marker-group');
  g.innerHTML = '';
  GENRES[document.getElementById('inp-genre').value].marker(g);
}

// Celebration: flash glitch effect instead of flowers
function celebrate() {
  if (celebrating) return;
  celebrating = true;
  const cc = document.getElementById('confetti-container');
  cc.innerHTML = '';

  // Red/white flash particles (crime scene tape style)
  const colors = ['#ff2020', '#ffffff', '#ffdd00', '#ff6060', '#ffaa00', '#cc0000'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div'), s = Math.random() * 6 + 2;
    const isRect = Math.random() > 0.4;
    el.style.cssText = `position:absolute;width:${isRect ? s * 3 : s}px;height:${s}px;background:${colors[i % colors.length]};border-radius:${isRect ? '1px' : '50%'};left:${Math.random() * 100}%;top:-12px;opacity:1`;
    cc.appendChild(el);
    el.animate([
      { transform: 'translateY(0) translateX(0) rotate(0deg)', opacity: 1 },
      { transform: `translateY(${Math.random() * 260 + 40}px) translateX(${(Math.random() - .5) * 160}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }
    ], { duration: Math.random() * 2000 + 1200, easing: 'cubic-bezier(0.25,0.46,0.45,0.94)', fill: 'forwards', delay: Math.random() * 500 });
  }

  let fr = 0, growing = true, sc = 1;
  function pulse() {
    fr++;
    if (fr > 50) { placeMarker(1); celebrating = false; return; }
    sc = growing ? sc + 0.06 : sc - 0.04;
    if (sc > 1.9) growing = false;
    const pt = ptAt(1);
    document.getElementById('marker-anchor').setAttribute('transform', `translate(${pt.x},${pt.y})`);
    document.getElementById('marker-sway').setAttribute('transform', `scale(${sc})`);
    requestAnimationFrame(pulse);
  }
  requestAnimationFrame(pulse);
  setTimeout(() => cc.innerHTML = '', 4000);
}

document.getElementById('inp-pct').addEventListener('input', e => {
  pct = parseInt(e.target.value);
  document.getElementById('pct-label').textContent = pct + '%';
  celebrating = false;
  render();
  if (pct >= 100) setTimeout(celebrate, 300);
});
['inp-title', 'inp-author', 'inp-time'].forEach(id => document.getElementById(id).addEventListener('input', updateTexts));
document.getElementById('inp-genre').addEventListener('change', () => { celebrating = false; render(); });
document.getElementById('file-in').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => { bgImage = ev.target.result; document.getElementById('bg-layer').style.backgroundImage = `url(${bgImage})`; document.getElementById('canvas-wrap').style.background = 'transparent'; };
  r.readAsDataURL(file);
});
function clearBg() { bgImage = null; document.getElementById('bg-layer').style.backgroundImage = ''; applyGenreTheme(); }
function setSize(k, btn) { currentSize = k; document.querySelectorAll('.sz').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
const SIZES = { 'landscape': { w: 1080, h: 566 }, 'ig-post': { w: 1080, h: 1080 }, 'ig-story': { w: 1080, h: 1920 }, 'pinterest': { w: 1000, h: 1500 } };

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}

function downloadImg() {
  const sz = SIZES[currentSize], genre = GENRES[document.getElementById('inp-genre').value];
  const canvas = document.createElement('canvas');
  canvas.width = sz.w; canvas.height = sz.h;
  const ctx = canvas.getContext('2d');
  ctx.save();
  roundRect(ctx, 0, 0, sz.w, sz.h, sz.w * 0.04);
  ctx.clip();
  const clone = document.getElementById('main-svg').cloneNode(true);
  clone.setAttribute('width', sz.w); clone.setAttribute('height', sz.h);
  clone.setAttribute('viewBox', '0 0 380 280');
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml' }));
  const img = new Image();
  img.onload = () => {
    if (!bgImage) { ctx.fillStyle = genre.bgSolid; ctx.fillRect(0, 0, sz.w, sz.h); }
    ctx.drawImage(img, 0, 0, sz.w, sz.h);
    ctx.restore();
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = 'current-reading-mystery.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

function render() { applyGenreTheme(); updateTexts(); placeMarker(); }
render(); startSway();
</script>
