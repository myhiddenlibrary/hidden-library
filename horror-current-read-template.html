<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Reading Tracker — Horror</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #080406; color: #eee; min-height: 100vh; }
#app { display: flex; min-height: 100vh; }
#panel { width: 250px; min-width: 220px; padding: 14px; border-right: 1px solid rgba(160,20,20,0.15); display: flex; flex-direction: column; gap: 10px; background: #0c0608; overflow-y: auto; }
#canvas-outer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: #060304; }
#canvas-wrap { position: relative; width: 380px; height: 280px; border-radius: 24px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 48px rgba(120,0,0,0.5); transition: all 0.4s ease; }
#bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 24px; }
#main-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px; }
body.preview-mode #panel { display: none; }
body.preview-mode #canvas-outer { background: #000; padding: 0; }
body.preview-mode #canvas-wrap { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
body.preview-mode #preview-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; opacity: 0.2; font-size: 10px; padding: 6px 14px; background: rgba(160,20,20,0.15); border: 1px solid rgba(160,20,20,0.3); border-radius: 20px; color: white; cursor: pointer; width: auto; }
body.preview-mode #preview-btn:hover { opacity: 0.8; }
label { font-size: 11px; color: #6a4040; display: block; margin-bottom: 3px; }
input[type=text], select { width: 100%; font-size: 12px; padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(160,40,40,0.15); background: rgba(120,20,20,0.08); color: #ddd; }
input[type=range] { width: 100%; accent-color: #c02020; }
.row { display: flex; gap: 8px; align-items: center; }
.pct-val { font-size: 12px; font-weight: 500; min-width: 36px; color: #eee; }
button { font-size: 11px; border: 1px solid rgba(160,40,40,0.15); border-radius: 8px; padding: 6px 8px; background: rgba(120,20,20,0.07); color: #ddd; cursor: pointer; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button:hover { background: rgba(160,30,30,0.15); }
.sec { font-size: 10px; font-weight: 600; color: #4a2020; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
.size-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.sz { font-size: 10px; padding: 6px 4px; line-height: 1.3; text-align: center; white-space: normal; }
.sz.active { background: rgba(180,20,20,0.25); color: #e04040; border-color: #c03030; }
.dl-btn { background: rgba(180,20,20,0.2) !important; color: #e04040 !important; border-color: #c03030 !important; font-weight: 600; }
.hint { font-size: 10px; color: #4a2020; text-align: center; line-height: 1.5; margin-top: 2px; }
#preview-btn { font-size: 10px; color: #3a1818; background: none; border: none; cursor: pointer; width: auto; text-align: center; padding: 2px; letter-spacing: 0.5px; margin-top: 2px; }
#preview-btn:hover { color: #6a4040; background: none; }
@media (max-width: 640px) {
  #app { flex-direction: column; }
  #panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(160,20,20,0.1); }
  #canvas-outer { padding: 16px; }
  #canvas-wrap { width: 100%; max-width: 380px; height: auto; aspect-ratio: 380/280; }
}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div style="font-size:14px;font-weight:700;color:#c03030;margin-bottom:4px;">💀 Current Reading</div>
    <div class="sec">Book Info</div>
    <div><label>Title</label><input type="text" id="inp-title" value="The Haunting of Hill House"></div>
    <div><label>Author</label><input type="text" id="inp-author" value="Shirley Jackson"></div>
    <div><label>Subgenre</label>
      <select id="inp-genre">
        <option value="psychological" selected>Psychological Horror</option>
        <option value="supernatural">Supernatural Horror</option>
        <option value="gothic">Gothic Horror</option>
        <option value="cosmic">Cosmic Horror</option>
        <option value="folk">Folk Horror</option>
        <option value="body">Body Horror</option>
        <option value="occult">Occult Horror</option>
        <option value="survival">Survival Horror</option>
        <option value="splatterpunk">Splatterpunk</option>
      </select>
    </div>
    <div><label>Reading Time</label><input type="text" id="inp-time" value="3 hrs"></div>
    <div><label>Progress</label>
      <div class="row">
        <input type="range" id="inp-pct" min="0" max="100" value="37" style="flex:1">
        <span class="pct-val" id="pct-label">37%</span>
      </div>
    </div>
    <div class="sec">Background</div>
    <button onclick="document.getElementById('file-in').click()">Upload image</button>
    <input type="file" id="file-in" accept="image/*" style="display:none">
    <button onclick="clearBg()">Reset to default</button>
    <div class="sec">Download</div>
    <div class="size-btns">
      <button class="sz active" onclick="setSize('landscape',this)">1080 x 566</button>
      <button class="sz" onclick="setSize('ig-post',this)">1080 x 1080</button>
      <button class="sz" onclick="setSize('ig-story',this)">1080 x 1920</button>
      <button class="sz" onclick="setSize('pinterest',this)">1000 x 1500</button>
    </div>
    <button class="dl-btn" onclick="downloadImg()">Download PNG</button>
    <div class="hint">Slide to 100%... if you dare. 🩸</div>
    <button id="preview-btn" onclick="togglePreview()">⛶ preview</button>
  </div>

  <div id="canvas-outer">
    <div id="canvas-wrap">
      <div id="bg-layer"></div>
      <div id="confetti-container"></div>
      <svg id="main-svg" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="blood-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="eerie-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="title-clip"><rect x="10" y="8" width="165" height="120"/></clipPath>
        </defs>

        <!-- Horror map bg: cracked earth / graveyard grid -->
        <g id="map-grid" opacity="0.11">
          <line x1="0"   y1="56"  x2="380" y2="56"  stroke="#8b2020" stroke-width="0.5"/>
          <line x1="0"   y1="112" x2="380" y2="112" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="0"   y1="168" x2="380" y2="168" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="0"   y1="224" x2="380" y2="224" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="56"  y1="0"   x2="56"  y2="280" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="112" y1="0"   x2="112" y2="280" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="168" y1="0"   x2="168" y2="280" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="224" y1="0"   x2="224" y2="280" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="280" y1="0"   x2="280" y2="280" stroke="#8b2020" stroke-width="0.5"/>
          <line x1="336" y1="0"   x2="336" y2="280" stroke="#8b2020" stroke-width="0.5"/>
          <!-- Crack lines (irregular diagonals) -->
          <line x1="0"   y1="280" x2="140" y2="80"  stroke="#8b2020" stroke-width="0.3" opacity="0.7"/>
          <line x1="100" y1="280" x2="260" y2="60"  stroke="#8b2020" stroke-width="0.3" opacity="0.5"/>
          <line x1="220" y1="280" x2="380" y2="100" stroke="#8b2020" stroke-width="0.3" opacity="0.7"/>
          <line x1="380" y1="200" x2="200" y2="0"   stroke="#8b2020" stroke-width="0.3" opacity="0.5"/>
        </g>

        <!-- Graveyard terrain features -->
        <g id="terrain-marks" opacity="0.1">
          <!-- Gravestones (cross + arch shapes) -->
          <rect x="58"  y="98"  width="10" height="14" rx="5 5 0 0" fill="#8b2020"/>
          <line x1="63" y1="104" x2="63" y2="112" stroke="#8b2020" stroke-width="1.5"/>
          <line x1="59" y1="107" x2="67" y2="107" stroke="#8b2020" stroke-width="1.5"/>
          <rect x="172" y="154" width="10" height="14" rx="5 5 0 0" fill="#8b2020"/>
          <line x1="177" y1="160" x2="177" y2="168" stroke="#8b2020" stroke-width="1.5"/>
          <line x1="173" y1="163" x2="181" y2="163" stroke="#8b2020" stroke-width="1.5"/>
          <rect x="288" y="56"  width="10" height="14" rx="5 5 0 0" fill="#8b2020"/>
          <line x1="293" y1="62"  x2="293" y2="70"  stroke="#8b2020" stroke-width="1.5"/>
          <line x1="289" y1="65"  x2="297" y2="65"  stroke="#8b2020" stroke-width="1.5"/>
          <!-- Dead bare trees -->
          <line x1="130" y1="220" x2="130" y2="195" stroke="#8b2020" stroke-width="1.5"/>
          <line x1="130" y1="205" x2="120" y2="196" stroke="#8b2020" stroke-width="1"/>
          <line x1="130" y1="200" x2="140" y2="192" stroke="#8b2020" stroke-width="1"/>
          <line x1="130" y1="197" x2="124" y2="191" stroke="#8b2020" stroke-width="0.8"/>
          <line x1="240" y1="220" x2="240" y2="195" stroke="#8b2020" stroke-width="1.5"/>
          <line x1="240" y1="207" x2="230" y2="198" stroke="#8b2020" stroke-width="1"/>
          <line x1="240" y1="202" x2="252" y2="194" stroke="#8b2020" stroke-width="1"/>
          <!-- Haunted house silhouette (far right) -->
          <rect x="330" y="220" width="28" height="20" fill="#8b2020"/>
          <polygon points="330,220 344,206 358,220" fill="#8b2020"/>
          <polygon points="338,210 344,204 350,210" fill="#8b2020"/>
          <!-- Tiny tower -->
          <rect x="340" y="200" width="8" height="12" fill="#8b2020"/>
          <polygon points="340,200 344,195 348,200" fill="#8b2020"/>
          <!-- Windows (eye-like) -->
          <ellipse cx="337" cy="228" rx="2" ry="2.5" fill="#060304"/>
          <ellipse cx="351" cy="228" rx="2" ry="2.5" fill="#060304"/>
        </g>

        <!-- Path of dread -->
        <path id="road-border" d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-body"   d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-dash"   d="" fill="none" stroke-linecap="round"/>

        <!-- Start: cracked gravestone -->
        <g transform="translate(28,245)">
          <rect x="-6" y="-12" width="12" height="14" rx="6 6 0 0" fill="rgba(100,20,20,0.3)" stroke="rgba(160,40,40,0.7)" stroke-width="1.2"/>
          <line x1="0"  y1="-8" x2="0"  y2="2"  stroke="rgba(160,40,40,0.7)" stroke-width="1" stroke-linecap="round"/>
          <line x1="-4" y1="-4" x2="4"  y2="-4" stroke="rgba(160,40,40,0.7)" stroke-width="1" stroke-linecap="round"/>
          <text x="12" y="4" font-size="7.5" fill="rgba(255,255,255,0.38)" font-family="Georgia,serif" font-style="italic">begin</text>
        </g>

        <!-- End: glowing red eye / portal -->
        <g transform="translate(342,30)" filter="url(#blood-glow)">
          <circle cx="0" cy="0" r="8"   fill="rgba(180,0,0,0.15)" stroke="rgba(200,30,30,0.8)" stroke-width="1.4"/>
          <ellipse cx="0" cy="0" rx="4" ry="5.5" fill="rgba(220,40,40,0.5)"/>
          <ellipse cx="0" cy="0" rx="1.5" ry="3" fill="#ff2020"/>
          <text x="12" y="4" font-size="7.5" fill="rgba(255,255,255,0.38)" font-family="Georgia,serif" font-style="italic">end</text>
        </g>

        <!-- Compass: bone / skull style -->
        <g transform="translate(355,255)" opacity="0.2">
          <circle cx="0" cy="0" r="13" fill="none" stroke="#8b2020" stroke-width="0.8"/>
          <circle cx="0" cy="0" r="3"  fill="rgba(100,20,20,0.4)"/>
          <line x1="0" y1="-11" x2="0"   y2="11"  stroke="#8b2020" stroke-width="0.8"/>
          <line x1="-11" y1="0" x2="11"  y2="0"   stroke="#8b2020" stroke-width="0.8"/>
          <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8" stroke="#8b2020" stroke-width="0.4"/>
          <line x1="7.8" y1="-7.8" x2="-7.8" y2="7.8" stroke="#8b2020" stroke-width="0.4"/>
          <polygon points="0,-11 -2,-4 2,-4" fill="#8b2020"/>
          <text x="0" y="-14" font-size="5" fill="#8b2020" text-anchor="middle" font-family="Georgia,serif">N</text>
        </g>

        <g clip-path="url(#title-clip)">
          <g id="title-group"></g>
          <text id="svg-author" x="16" y="999" font-family="Georgia,serif" font-size="11" font-style="italic" fill="rgba(255,255,255,0.68)">Shirley Jackson</text>
          <text id="svg-genre-label" x="16" y="999" font-family="Georgia,serif" font-size="9" fill="rgba(180,60,60,0.65)" font-style="italic">Psychological Horror</text>
        </g>
        <text id="svg-time" x="295" y="195" font-family="Georgia,serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.78)" text-anchor="middle" filter="url(#soft-glow)">3 hrs</text>
        <text id="svg-pct"  x="295" y="250" font-family="Georgia,serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.95" filter="url(#soft-glow)">37%</text>
        <g id="marker-anchor"><g id="marker-sway"><g id="marker-group"></g></g></g>
      </svg>
    </div>
  </div>
</div>

<script>
// Path of dread — slow winding curve like a dark corridor
const PATH_D = "M 28 245 C 52 226, 72 212, 104 192 C 132 174, 146 152, 174 130 C 200 110, 222 104, 250 82 C 272 64, 308 46, 342 30";

// ── Genre config ──────────────────────────────────────────────────────────────
const GENRES = {
  psychological: { roadTop:'#5a1a3a', bg:'linear-gradient(135deg,#0c0408 0%,#180810 100%)', bgSolid:'#0c0408', genreLabel:'Psychological Horror', marker:drawMirror,    accent:'#a03060', anim:'tremble'  },
  supernatural:  { roadTop:'#2a1a5a', bg:'linear-gradient(135deg,#06040e 0%,#0e0820 100%)', bgSolid:'#06040e', genreLabel:'Supernatural Horror',  marker:drawGhost,     accent:'#7060c0', anim:'float'    },
  gothic:        { roadTop:'#3a1a1a', bg:'linear-gradient(135deg,#0a0606 0%,#160a0a 100%)', bgSolid:'#0a0606', genreLabel:'Gothic Horror',         marker:drawCoffin,    accent:'#8b2020', anim:'creak'    },
  cosmic:        { roadTop:'#0a1a3a', bg:'linear-gradient(135deg,#020408 0%,#04080e 100%)', bgSolid:'#020408', genreLabel:'Cosmic Horror',         marker:drawTentacle,  accent:'#204060', anim:'writhe'   },
  folk:          { roadTop:'#3a2a0a', bg:'linear-gradient(135deg,#0a0804 0%,#160e04 100%)', bgSolid:'#0a0804', genreLabel:'Folk Horror',           marker:drawWickerMan, accent:'#806020', anim:'sway'     },
  body:          { roadTop:'#5a0a0a', bg:'linear-gradient(135deg,#0e0202 0%,#1a0404 100%)', bgSolid:'#0e0202', genreLabel:'Body Horror',           marker:drawMutation,  accent:'#c01010', anim:'pulse'    },
  occult:        { roadTop:'#3a0a4a', bg:'linear-gradient(135deg,#08020c 0%,#120414 100%)', bgSolid:'#08020c', genreLabel:'Occult Horror',         marker:drawPentagram, accent:'#800090', anim:'spin'     },
  survival:      { roadTop:'#1a3a1a', bg:'linear-gradient(135deg,#040a04 0%,#081408 100%)', bgSolid:'#040a04', genreLabel:'Survival Horror',       marker:drawFlashlight,accent:'#306030', anim:'shake'    },
  splatterpunk:  { roadTop:'#6a0808', bg:'linear-gradient(135deg,#100202 0%,#1e0404 100%)', bgSolid:'#100202', genreLabel:'Splatterpunk',          marker:drawChainsaw,  accent:'#e01010', anim:'rev'      },
};

// ── Cursor drawing functions ──────────────────────────────────────────────────

// Psychological Horror → Cracked mirror — fractured reflection of the self
function drawMirror(g) {
  g.innerHTML = `<g>
    <!-- Mirror frame (ornate) -->
    <ellipse cx="0" cy="-2" rx="13" ry="16" fill="none" stroke="#8a4060" stroke-width="2.5"/>
    <ellipse cx="0" cy="-2" rx="11" ry="14" fill="#0c0408" stroke="#6a3050" stroke-width="1"/>
    <!-- Crown top of frame -->
    <path d="M-6,-17 Q0,-22 6,-17" fill="none" stroke="#8a4060" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-6" cy="-17" r="1.5" fill="#a05070"/>
    <circle cx="0"  cy="-22" r="2"   fill="#c06080"/>
    <circle cx="6"  cy="-17" r="1.5" fill="#a05070"/>
    <!-- Glass cracks radiating from center -->
    <line x1="0"  y1="-2" x2="-8"  y2="-10" stroke="rgba(200,150,180,0.6)" stroke-width="0.8"/>
    <line x1="0"  y1="-2" x2="9"   y2="-8"  stroke="rgba(200,150,180,0.6)" stroke-width="0.8"/>
    <line x1="0"  y1="-2" x2="10"  y2="5"   stroke="rgba(200,150,180,0.5)" stroke-width="0.7"/>
    <line x1="0"  y1="-2" x2="-9"  y2="8"   stroke="rgba(200,150,180,0.5)" stroke-width="0.7"/>
    <line x1="0"  y1="-2" x2="2"   y2="12"  stroke="rgba(200,150,180,0.4)" stroke-width="0.6"/>
    <line x1="0"  y1="-2" x2="-3"  y2="-14" stroke="rgba(200,150,180,0.5)" stroke-width="0.7"/>
    <!-- Sub-cracks -->
    <line x1="-5" y1="-8"  x2="-10" y2="-6"  stroke="rgba(200,150,180,0.35)" stroke-width="0.5"/>
    <line x1="6"  y1="-6"  x2="10"  y2="-3"  stroke="rgba(200,150,180,0.35)" stroke-width="0.5"/>
    <line x1="7"  y1="3"   x2="11"  y2="7"   stroke="rgba(200,150,180,0.3)"  stroke-width="0.5"/>
    <line x1="-6" y1="5"   x2="-11" y2="9"   stroke="rgba(200,150,180,0.3)"  stroke-width="0.5"/>
    <!-- Eerie eye reflection in center -->
    <ellipse cx="0" cy="-2" rx="3" ry="4"   fill="#1a0810" stroke="#c06080" stroke-width="0.6"/>
    <ellipse cx="0" cy="-2" rx="1.5" ry="2.5" fill="#a03060" opacity="0.7" filter="url(#eerie-glow)"/>
    <ellipse cx="0" cy="-2" rx="0.6" ry="1" fill="#ff4080" opacity="0.9"/>
    <!-- Frame bottom scroll -->
    <path d="M-5,14 Q0,17 5,14" fill="none" stroke="#8a4060" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="18" rx="8" ry="2" fill="rgba(160,60,100,0.2)"/>
  </g>`;
}

// Supernatural Horror → Floating ghost with tattered edges and glowing eyes
function drawGhost(g) {
  g.innerHTML = `<g>
    <!-- Outer glow aura -->
    <ellipse cx="0" cy="-2" rx="14" ry="18" fill="rgba(80,60,180,0.12)" filter="url(#eerie-glow)"/>
    <!-- Main ghost body -->
    <path d="M0,-20 Q11,-18 12,-6 Q13,6 12,14 Q9,20 6,16 Q3,22 0,18 Q-3,22 -6,16 Q-9,20 -12,14 Q-13,6 -12,-6 Q-11,-18 0,-20 Z"
      fill="#100c20" stroke="#a090e0" stroke-width="1.4"/>
    <!-- Inner body highlight -->
    <path d="M0,-16 Q8,-14 8,-4 Q8,4 7,10 Q4,16 0,12 Q-4,16 -7,10 Q-8,4 -8,-4 Q-8,-14 0,-16 Z"
      fill="#180e2c" opacity="0.7"/>
    <!-- Eyes (glowing violet) -->
    <ellipse cx="-4" cy="-8" rx="2.8" ry="3.5" fill="#7060c0" opacity="0.95" filter="url(#eerie-glow)"/>
    <ellipse cx="4"  cy="-8" rx="2.8" ry="3.5" fill="#7060c0" opacity="0.95" filter="url(#eerie-glow)"/>
    <ellipse cx="-4" cy="-8" rx="1.2" ry="1.8" fill="#d0c0ff" opacity="0.9"/>
    <ellipse cx="4"  cy="-8" rx="1.2" ry="1.8" fill="#d0c0ff" opacity="0.9"/>
    <!-- Mouth (wavy screaming) -->
    <path d="M-4,0 Q-2,3 0,1 Q2,3 4,0" fill="none" stroke="#7060c0" stroke-width="1" stroke-linecap="round"/>
    <!-- Reaching arms / wisps -->
    <path d="M-12,-2 Q-18,-6 -20,-2 Q-18,2 -13,2" fill="rgba(80,60,180,0.3)" stroke="#a090e0" stroke-width="0.8"/>
    <path d="M12,-2  Q18,-6 20,-2  Q18,2  13,2"  fill="rgba(80,60,180,0.3)" stroke="#a090e0" stroke-width="0.8"/>
    <!-- Floating mist tendrils -->
    <path d="M-6,16  Q-8,22  -6,26"  fill="none" stroke="#a090e0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M0,18   Q0,24   2,28"   fill="none" stroke="#a090e0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M6,16   Q8,22   6,26"   fill="none" stroke="#a090e0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Ground mist -->
    <ellipse cx="0" cy="30" rx="10" ry="3" fill="rgba(80,60,180,0.15)" filter="url(#eerie-glow)"/>
  </g>`;
}

// Gothic Horror → Coffin standing upright, ornate, slightly ajar lid
function drawCoffin(g) {

// ── Core engine ───────────────────────────────────────────────────────────────
let pct = 37, currentSize = 'landscape', bgImage = null, celebrating = false, swayAnim = null, isPreview = false;

function getSVGPath() {
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', PATH_D);
  return p;
}
function ptAt(t) {
  const p = getSVGPath();
  return p.getPointAtLength(p.getTotalLength() * Math.min(Math.max(t,0),1));
}
function togglePreview() {
  isPreview = !isPreview;
  document.body.classList.toggle('preview-mode', isPreview);
  const btn = document.getElementById('preview-btn');
  if (isPreview) { document.body.appendChild(btn); btn.textContent = '✕ exit'; }
  else { document.getElementById('panel').appendChild(btn); btn.textContent = '⛶ preview'; }
}

function applyGenreTheme() {
  const G = GENRES[document.getElementById('inp-genre').value];
  if (!bgImage) document.getElementById('canvas-wrap').style.background = G.bg;
  document.getElementById('road-border').setAttribute('stroke','rgba(0,0,0,0.5)');
  document.getElementById('road-border').setAttribute('stroke-width','26');
  document.getElementById('road-border').setAttribute('d', PATH_D);
  document.getElementById('road-body').setAttribute('stroke', G.roadTop);
  document.getElementById('road-body').setAttribute('stroke-width','18');
  document.getElementById('road-body').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('stroke','rgba(255,255,255,0.15)');
  document.getElementById('road-dash').setAttribute('stroke-width','1.5');
  document.getElementById('road-dash').setAttribute('stroke-dasharray','4 12');
  document.getElementById('svg-genre-label').textContent = G.genreLabel;
  document.querySelectorAll('#map-grid line').forEach(l => l.setAttribute('stroke', G.accent));
  document.querySelectorAll('#terrain-marks rect, #terrain-marks polygon, #terrain-marks line, #terrain-marks ellipse, #terrain-marks circle').forEach(el => {
    const tag = el.tagName;
    if (tag === 'line' || tag === 'polyline') el.setAttribute('stroke', G.accent);
    else el.setAttribute('fill', G.accent);
  });
}

function renderTitle(text) {
  const g = document.getElementById('title-group');
  g.innerHTML = '';
  const MAX_W=158, MAX_FONT=20, MIN_FONT=12, LH=1.28, START_Y=28;
  const ns='http://www.w3.org/2000/svg';
  let chosenFont=MIN_FONT, chosenLines=[text];
  for (let fs=MAX_FONT; fs>=MIN_FONT; fs--) {
    const cpl=Math.floor(MAX_W/(fs*0.56));
    const lines=wrapText(text,cpl);
    if (lines.length*fs*LH<=54) { chosenFont=fs; chosenLines=lines; break; }
  }
  const el=document.createElementNS(ns,'text');
  el.setAttribute('font-family','Georgia,serif');
  el.setAttribute('font-size',chosenFont);
  el.setAttribute('font-weight','700');
  el.setAttribute('fill','white');
  el.setAttribute('opacity','0.95');
  el.setAttribute('filter','url(#soft-glow)');
  chosenLines.forEach((line,i)=>{
    const ts=document.createElementNS(ns,'tspan');
    ts.setAttribute('x','16');
    ts.setAttribute('y', START_Y + i*chosenFont*LH);
    ts.textContent=line;
    el.appendChild(ts);
  });
  g.appendChild(el);
  return START_Y+(chosenLines.length-1)*chosenFont*LH+chosenFont*0.3;
}

function wrapText(text,cpl) {
  const words=text.split(' '),lines=[];
  let cur='';
  for (const w of words) {
    const t=cur?cur+' '+w:w;
    if (t.length>cpl&&cur){lines.push(cur);cur=w;}else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}

function updateTexts() {
  const titleText=document.getElementById('inp-title').value||'Title';
  const authorText=document.getElementById('inp-author').value||'Author';
  const genre=document.getElementById('inp-genre').value;
  const timeText=document.getElementById('inp-time').value||'';
  const bottomY=renderTitle(titleText);
  document.getElementById('svg-author').setAttribute('y', bottomY+18);
  document.getElementById('svg-author').textContent=authorText;
  document.getElementById('svg-genre-label').setAttribute('y', bottomY+34);
  document.getElementById('svg-genre-label').textContent=GENRES[genre].genreLabel;
  document.getElementById('svg-time').textContent=timeText;
  document.getElementById('svg-pct').textContent=pct+'%';
}

function startSway() {
  if(swayAnim) cancelAnimationFrame(swayAnim);
  let t0=null;
  function frame(ts) {
    if(!t0) t0=ts;
    const e=(ts-t0)/1000;
    const anim=GENRES[document.getElementById('inp-genre').value].anim;
    const sway=document.getElementById('marker-sway');
    switch(anim) {
      case 'tremble':
        // Mirror: rapid micro-trembles — paranoid jitter
        const tx=(Math.random()-0.5)*3, ty=(Math.random()-0.5)*2;
        sway.setAttribute('transform',`translate(${tx},${ty}) rotate(${Math.sin(e*8)*4})`);
        break;
      case 'float':
        // Ghost: lazy sinuous drift — up/down + side lean
        sway.setAttribute('transform',
          `translate(${Math.sin(e*0.8)*6},${Math.sin(e*1.2)*7}) rotate(${Math.sin(e*0.6)*8})`);
        break;
      case 'creak':
        // Coffin: slow pendulum creak as if hanging
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.9)*14}) translate(0,${Math.sin(e*1.8)*2})`);
        break;
      case 'writhe':
        // Tentacle eye: slow tentacle writhe, hypnotic
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.5)*15}) scale(${1+Math.sin(e*1.4)*0.08}) translate(${Math.sin(e*0.7)*4},0)`);
        break;
      case 'sway':
        // Wicker Man: slow burn sway in the wind
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*1.1)*12}) translate(0,${Math.sin(e*2.2)*2})`);
        break;
      case 'pulse':
        // Body Horror: organic pulsing — breathes in and out asymmetrically
        const sx=1+Math.sin(e*2.2)*0.14, sy=1+Math.cos(e*2.5)*0.12;
        sway.setAttribute('transform',`scale(${sx},${sy}) rotate(${Math.sin(e*0.8)*6})`);
        break;
      case 'spin':
        // Pentagram: slow ritualistic spin — reverses direction
        const dir=Math.sin(e*0.3)>0?1:-1;
        sway.setAttribute('transform',
          `rotate(${e*25*dir % 360}) translate(0,${Math.sin(e*1.5)*2})`);
        break;
      case 'shake':
        // Flashlight: nervous hand shake — fast jitter
        const fx=(Math.sin(e*12)*2.5)+(Math.sin(e*7)*1.5);
        const fy=(Math.cos(e*10)*1.5);
        sway.setAttribute('transform',`translate(${fx},${fy}) rotate(${Math.sin(e*9)*5})`);
        break;
      case 'rev':
        // Chainsaw: engine rev vibration — fast rhythmic shudder
        const rv=Math.sin(e*16)*2;
        sway.setAttribute('transform',
          `translate(${rv},${Math.abs(rv)*0.5}) rotate(${Math.sin(e*14)*3})`);
        break;
      default:
        sway.setAttribute('transform',`rotate(${Math.sin(e*1.2)*6})`);
    }
    swayAnim=requestAnimationFrame(frame);
  }
  swayAnim=requestAnimationFrame(frame);
}

function placeMarker(scale=1) {
  const pt=ptAt(pct/100);
  document.getElementById('marker-anchor').setAttribute('transform',`translate(${pt.x},${pt.y})`);
  if(scale!==1) document.getElementById('marker-sway').setAttribute('transform',`scale(${scale})`);
  const g=document.getElementById('marker-group');
  g.innerHTML='';
  GENRES[document.getElementById('inp-genre').value].marker(g);
}

// Celebration: blood splatter + bats flying out
function celebrate() {
  if(celebrating) return;
  celebrating=true;
  const cc=document.getElementById('confetti-container');
  cc.innerHTML='';
  const colors=['#cc0000','#880000','#ff2020','#ff6060','#aa0000','#ff0040','#660000','#ff4040'];
  const batSVG=`<svg viewBox="-8 -4 16 8" width="16" height="8" xmlns="http://www.w3.org/2000/svg"><path d="M0,-2 Q-2,-5 -8,-3 Q-4,0 -2,1 Q0,3 2,1 Q4,0 8,-3 Q2,-5 0,-2 Z" fill="#220000"/></svg>`;
  for (let i=0; i<80; i++) {
    const el=document.createElement('div');
    const isBat=Math.random()>0.55, s=Math.random()*7+3;
    if(isBat) {
      el.innerHTML=batSVG;
      el.style.cssText=`position:absolute;left:${Math.random()*100}%;top:-16px;opacity:0.9;filter:drop-shadow(0 0 4px #660000)`;
    } else {
      // Blood drop or splat
      const isRound=Math.random()>0.4;
      el.style.cssText=`position:absolute;width:${s}px;height:${isRound?s:s*2}px;background:${colors[i%colors.length]};border-radius:${isRound?'50%':'50% 50% 50% 50% / 60% 60% 40% 40%'};left:${Math.random()*100}%;top:-12px;opacity:0.9;box-shadow:0 0 6px ${colors[i%colors.length]}`;
    }
    cc.appendChild(el);
    el.animate([
      { transform:'translateY(0) translateX(0) rotate(0deg) scale(1)', opacity:0.9 },
      { transform:`translateY(${Math.random()*260+40}px) translateX(${(Math.random()-.5)*180}px) rotate(${Math.random()*540}deg) scale(${Math.random()*0.3+0.1})`, opacity:0 }
    ],{ duration:Math.random()*2400+1000, easing:'cubic-bezier(0.25,0.46,0.45,0.94)', fill:'forwards', delay:Math.random()*600 });
  }
  let fr=0, growing=true, sc=1;
  function pulse() {
    fr++;
    if(fr>60){placeMarker(1);celebrating=false;return;}
    sc=growing?sc+0.05:sc-0.04;
    if(sc>2.0) growing=false;
    const pt=ptAt(1);
    document.getElementById('marker-anchor').setAttribute('transform',`translate(${pt.x},${pt.y})`);
    document.getElementById('marker-sway').setAttribute('transform',`scale(${sc})`);
    requestAnimationFrame(pulse);
  }
  requestAnimationFrame(pulse);
  setTimeout(()=>cc.innerHTML='',4500);
}

document.getElementById('inp-pct').addEventListener('input',e=>{
  pct=parseInt(e.target.value);
  document.getElementById('pct-label').textContent=pct+'%';
  celebrating=false;
  render();
  if(pct>=100) setTimeout(celebrate,300);
});
['inp-title','inp-author','inp-time'].forEach(id=>document.getElementById(id).addEventListener('input',updateTexts));
document.getElementById('inp-genre').addEventListener('change',()=>{celebrating=false;render();startSway();});
document.getElementById('file-in').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{bgImage=ev.target.result;document.getElementById('bg-layer').style.backgroundImage=`url(${bgImage})`;document.getElementById('canvas-wrap').style.background='transparent';};
  r.readAsDataURL(file);
});
function clearBg(){bgImage=null;document.getElementById('bg-layer').style.backgroundImage='';applyGenreTheme();}
function setSize(k,btn){currentSize=k;document.querySelectorAll('.sz').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
const SIZES={'landscape':{w:1080,h:566},'ig-post':{w:1080,h:1080},'ig-story':{w:1080,h:1920},'pinterest':{w:1000,h:1500}};

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function downloadImg(){
  const sz=SIZES[currentSize],genre=GENRES[document.getElementById('inp-genre').value];
  const canvas=document.createElement('canvas');
  canvas.width=sz.w;canvas.height=sz.h;
  const ctx=canvas.getContext('2d');
  ctx.save();
  roundRect(ctx,0,0,sz.w,sz.h,sz.w*0.04);
  ctx.clip();
  const clone=document.getElementById('main-svg').cloneNode(true);
  clone.setAttribute('width',sz.w);clone.setAttribute('height',sz.h);
  clone.setAttribute('viewBox','0 0 380 280');
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));
  const img=new Image();
  img.onload=()=>{
    if(!bgImage){ctx.fillStyle=genre.bgSolid;ctx.fillRect(0,0,sz.w,sz.h);}
    ctx.drawImage(img,0,0,sz.w,sz.h);
    ctx.restore();
    URL.revokeObjectURL(url);
    const a=document.createElement('a');
    a.download='current-reading-horror.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  };
  img.src=url;
}

function render(){applyGenreTheme();updateTexts();placeMarker();}
render();startSway();
</script>
