<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Reading Tracker — Sci-Fi</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #020a10; color: #eee; min-height: 100vh; }
#app { display: flex; min-height: 100vh; }
#panel { width: 250px; min-width: 220px; padding: 14px; border-right: 1px solid rgba(0,200,255,0.1); display: flex; flex-direction: column; gap: 10px; background: #040e18; overflow-y: auto; }
#canvas-outer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: #020810; }
#canvas-wrap { position: relative; width: 380px; height: 280px; border-radius: 24px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 48px rgba(0,160,255,0.25); transition: all 0.4s ease; }
#bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 24px; }
#main-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px; }
body.preview-mode #panel { display: none; }
body.preview-mode #canvas-outer { background: #000; padding: 0; }
body.preview-mode #canvas-wrap { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
body.preview-mode #preview-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; opacity: 0.2; font-size: 10px; padding: 6px 14px; background: rgba(0,200,255,0.1); border: 1px solid rgba(0,200,255,0.2); border-radius: 20px; color: white; cursor: pointer; width: auto; }
body.preview-mode #preview-btn:hover { opacity: 0.8; }
label { font-size: 11px; color: #5a8898; display: block; margin-bottom: 3px; }
input[type=text], select { width: 100%; font-size: 12px; padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(0,200,255,0.12); background: rgba(0,180,255,0.05); color: #eee; }
input[type=range] { width: 100%; accent-color: #00c8ff; }
.row { display: flex; gap: 8px; align-items: center; }
.pct-val { font-size: 12px; font-weight: 500; min-width: 36px; color: #eee; }
button { font-size: 11px; border: 1px solid rgba(0,200,255,0.1); border-radius: 8px; padding: 6px 8px; background: rgba(0,180,255,0.05); color: #eee; cursor: pointer; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button:hover { background: rgba(0,180,255,0.12); }
.sec { font-size: 10px; font-weight: 600; color: #2a5060; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
.size-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.sz { font-size: 10px; padding: 6px 4px; line-height: 1.3; text-align: center; white-space: normal; }
.sz.active { background: rgba(0,200,255,0.2); color: #00c8ff; border-color: #00c8ff; }
.dl-btn { background: rgba(0,200,255,0.15) !important; color: #00c8ff !important; border-color: #00c8ff !important; font-weight: 600; }
.hint { font-size: 10px; color: #2a5060; text-align: center; line-height: 1.5; margin-top: 2px; }
#preview-btn { font-size: 10px; color: #2a5060; background: none; border: none; cursor: pointer; width: auto; text-align: center; padding: 2px; letter-spacing: 0.5px; margin-top: 2px; }
#preview-btn:hover { color: #5a8898; background: none; }
@media (max-width: 640px) {
  #app { flex-direction: column; }
  #panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(0,200,255,0.08); }
  #canvas-outer { padding: 16px; }
  #canvas-wrap { width: 100%; max-width: 380px; height: auto; aspect-ratio: 380/280; }
}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div style="font-size:14px;font-weight:700;color:#00c8ff;margin-bottom:4px;">🚀 Current Reading</div>
    <div class="sec">Book Info</div>
    <div><label>Title</label><input type="text" id="inp-title" value="Dune"></div>
    <div><label>Author</label><input type="text" id="inp-author" value="Frank Herbert"></div>
    <div><label>Subgenre</label>
      <select id="inp-genre">
        <option value="hardscifi" selected>Hard Sci-Fi</option>
        <option value="softscifi">Soft Sci-Fi</option>
        <option value="spaceopera">Space Opera</option>
        <option value="cyberpunk">Cyberpunk</option>
        <option value="steampunk">Steampunk</option>
        <option value="dystopian">Dystopian</option>
        <option value="postapoc">Post-Apocalyptic</option>
        <option value="timetravel">Time Travel</option>
        <option value="military">Military Sci-Fi</option>
      </select>
    </div>
    <div><label>Reading Time</label><input type="text" id="inp-time" value="5 hrs"></div>
    <div><label>Progress</label>
      <div class="row">
        <input type="range" id="inp-pct" min="0" max="100" value="42" style="flex:1">
        <span class="pct-val" id="pct-label">42%</span>
      </div>
    </div>
    <div class="sec">Background</div>
    <button onclick="document.getElementById('file-in').click()">Upload image</button>
    <input type="file" id="file-in" accept="image/*" style="display:none">
    <button onclick="clearBg()">Reset to default</button>
    <div class="sec">Download</div>
    <div class="size-btns">
      <button class="sz active" onclick="setSize('landscape',this)">1080 x 566</button>
      <button class="sz" onclick="setSize('ig-post',this)">1080 x 1080</button>
      <button class="sz" onclick="setSize('ig-story',this)">1080 x 1920</button>
      <button class="sz" onclick="setSize('pinterest',this)">1000 x 1500</button>
    </div>
    <button class="dl-btn" onclick="downloadImg()">Download PNG</button>
    <div class="hint">Slide to 100% to reach the stars! 🛸</div>
    <button id="preview-btn" onclick="togglePreview()">⛶ preview</button>
  </div>

  <div id="canvas-outer">
    <div id="canvas-wrap">
      <div id="bg-layer"></div>
      <div id="confetti-container"></div>
      <svg id="main-svg" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="holo-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="neon-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="title-clip"><rect x="10" y="8" width="165" height="120"/></clipPath>
        </defs>

        <!-- Sci-fi background: star chart / circuit board grid -->
        <g id="map-grid" opacity="0.13">
          <line x1="0"   y1="40"  x2="380" y2="40"  stroke="#0080c0" stroke-width="0.5"/>
          <line x1="0"   y1="80"  x2="380" y2="80"  stroke="#0080c0" stroke-width="0.5"/>
          <line x1="0"   y1="120" x2="380" y2="120" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="0"   y1="160" x2="380" y2="160" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="0"   y1="200" x2="380" y2="200" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="0"   y1="240" x2="380" y2="240" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="40"  y1="0"   x2="40"  y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="80"  y1="0"   x2="80"  y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="120" y1="0"   x2="120" y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="160" y1="0"   x2="160" y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="200" y1="0"   x2="200" y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="240" y1="0"   x2="240" y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="280" y1="0"   x2="280" y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="320" y1="0"   x2="320" y2="280" stroke="#0080c0" stroke-width="0.5"/>
          <line x1="360" y1="0"   x2="360" y2="280" stroke="#0080c0" stroke-width="0.5"/>
        </g>

        <!-- Circuit / star chart markers -->
        <g id="terrain-marks" opacity="0.1">
          <!-- Circuit nodes -->
          <circle cx="80"  cy="80"  r="3" fill="#00c8ff"/>
          <circle cx="160" cy="120" r="3" fill="#00c8ff"/>
          <circle cx="240" cy="80"  r="3" fill="#00c8ff"/>
          <circle cx="320" cy="160" r="3" fill="#00c8ff"/>
          <circle cx="120" cy="200" r="3" fill="#00c8ff"/>
          <circle cx="200" cy="160" r="3" fill="#00c8ff"/>
          <circle cx="280" cy="200" r="3" fill="#00c8ff"/>
          <!-- Circuit traces between nodes -->
          <polyline points="80,80 160,80 160,120" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
          <polyline points="160,120 240,120 240,80" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
          <polyline points="240,80 320,80 320,160" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
          <polyline points="120,200 200,200 200,160" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
          <polyline points="200,160 280,160 280,200" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
          <!-- Star dots -->
          <circle cx="60"  cy="40"  r="1"   fill="#ffffff" opacity="0.8"/>
          <circle cx="100" cy="55"  r="1.5" fill="#ffffff" opacity="0.6"/>
          <circle cx="140" cy="35"  r="1"   fill="#ffffff" opacity="0.9"/>
          <circle cx="300" cy="50"  r="1.5" fill="#ffffff" opacity="0.7"/>
          <circle cx="340" cy="220" r="1"   fill="#ffffff" opacity="0.8"/>
          <circle cx="55"  cy="220" r="1.2" fill="#ffffff" opacity="0.6"/>
          <!-- Planet symbol -->
          <circle cx="345" cy="235" r="7"   fill="none" stroke="#00c8ff" stroke-width="1"/>
          <ellipse cx="345" cy="235" rx="12" ry="3.5" fill="none" stroke="#00c8ff" stroke-width="0.8" opacity="0.6"/>
        </g>

        <!-- Flight path -->
        <path id="road-border" d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-body"   d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-dash"   d="" fill="none" stroke-linecap="round"/>

        <!-- Launch pad marker (start) -->
        <g transform="translate(28,245)">
          <circle cx="0" cy="0" r="7" fill="rgba(0,180,255,0.15)" stroke="rgba(0,200,255,0.65)" stroke-width="1.2"/>
          <line x1="-4" y1="3" x2="4"  y2="3"  stroke="rgba(0,200,255,0.7)" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="-3" y1="0" x2="3"  y2="0"  stroke="rgba(0,200,255,0.5)" stroke-width="0.8" stroke-linecap="round"/>
          <line x1="0"  y1="-4" x2="0" y2="3"  stroke="rgba(0,200,255,0.8)" stroke-width="1.2" stroke-linecap="round"/>
          <text x="12" y="4" font-size="7.5" fill="rgba(255,255,255,0.45)" font-family="'Courier New',monospace">T-0</text>
        </g>

        <!-- Destination marker (end) -->
        <g transform="translate(342,30)" filter="url(#neon-glow)">
          <circle cx="0" cy="0" r="8" fill="rgba(0,255,180,0.12)" stroke="rgba(0,255,180,0.7)" stroke-width="1.4"/>
          <circle cx="0" cy="0" r="4" fill="rgba(0,255,180,0.35)"/>
          <circle cx="0" cy="0" r="1.5" fill="#00ffb0"/>
          <text x="12" y="4" font-size="7.5" fill="rgba(255,255,255,0.45)" font-family="'Courier New',monospace">ETA</text>
        </g>

        <!-- HUD compass (sci-fi style) -->
        <g transform="translate(355,255)" opacity="0.22">
          <circle cx="0" cy="0" r="13" fill="none" stroke="#00c8ff" stroke-width="0.8"/>
          <circle cx="0" cy="0" r="9"  fill="none" stroke="#00c8ff" stroke-width="0.4" stroke-dasharray="2 3"/>
          <circle cx="0" cy="0" r="2"  fill="rgba(0,200,255,0.4)"/>
          <line x1="0" y1="-11" x2="0" y2="11" stroke="#00c8ff" stroke-width="0.8"/>
          <line x1="-11" y1="0" x2="11" y2="0" stroke="#00c8ff" stroke-width="0.8"/>
          <polygon points="0,-11 -2,-5 2,-5" fill="#00c8ff"/>
          <text x="0" y="-14" font-size="5" fill="#00c8ff" text-anchor="middle" font-family="'Courier New',monospace">N</text>
        </g>

        <g clip-path="url(#title-clip)">
          <g id="title-group"></g>
          <text id="svg-author" x="16" y="999" font-family="'Courier New',Courier,monospace" font-size="11" font-style="italic" fill="rgba(255,255,255,0.72)">Frank Herbert</text>
          <text id="svg-genre-label" x="16" y="999" font-family="'Courier New',Courier,monospace" font-size="9" fill="rgba(0,200,255,0.55)" font-style="italic">Hard Sci-Fi</text>
        </g>
        <text id="svg-time" x="295" y="195" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="600" fill="rgba(255,255,255,0.80)" text-anchor="middle" filter="url(#soft-glow)">5 hrs</text>
        <text id="svg-pct"  x="295" y="250" font-family="'Courier New',Courier,monospace" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.96" filter="url(#soft-glow)">42%</text>
        <g id="marker-anchor"><g id="marker-sway"><g id="marker-group"></g></g></g>
      </svg>
    </div>
  </div>
</div>

<script>
// Flight path — long clean arc like a spacecraft trajectory
const PATH_D = "M 28 245 C 55 228, 78 210, 108 188 C 136 168, 152 148, 180 126 C 206 106, 228 100, 256 78 C 278 60, 312 44, 342 30";

// ── Genre config ──────────────────────────────────────────────────────────────
const GENRES = {
  hardscifi:  { roadTop:'#1060a0', bg:'linear-gradient(135deg,#020812 0%,#061020 100%)', bgSolid:'#020812', genreLabel:'Hard Sci-Fi',       marker:drawAtom,       accent:'#2090d0', anim:'orbit'    },
  softscifi:  { roadTop:'#306080', bg:'linear-gradient(135deg,#040e14 0%,#081a24 100%)', bgSolid:'#040e14', genreLabel:'Soft Sci-Fi',        marker:drawAndroid,    accent:'#40a0c0', anim:'walk'     },
  spaceopera: { roadTop:'#2040a0', bg:'linear-gradient(135deg,#02040e 0%,#04081c 100%)', bgSolid:'#02040e', genreLabel:'Space Opera',        marker:drawSpaceship,  accent:'#4060e0', anim:'soar'     },
  cyberpunk:  { roadTop:'#602080', bg:'linear-gradient(135deg,#08020e 0%,#100418 100%)', bgSolid:'#08020e', genreLabel:'Cyberpunk',          marker:drawCyborg,     accent:'#c020ff', anim:'glitch'   },
  steampunk:  { roadTop:'#806020', bg:'linear-gradient(135deg,#100c02 0%,#1e1604 100%)', bgSolid:'#100c02', genreLabel:'Steampunk',          marker:drawAirship,    accent:'#d0900a', anim:'chug'     },
  dystopian:  { roadTop:'#503020', bg:'linear-gradient(135deg,#0e0804 0%,#1a0e06 100%)', bgSolid:'#0e0804', genreLabel:'Dystopian',          marker:drawSurvivor,   accent:'#c06020', anim:'trudge'   },
  postapoc:   { roadTop:'#604030', bg:'linear-gradient(135deg,#100804 0%,#1c0e06 100%)', bgSolid:'#100804', genreLabel:'Post-Apocalyptic',   marker:drawScavenger,  accent:'#d08040', anim:'trudge'   },
  timetravel: { roadTop:'#206080', bg:'linear-gradient(135deg,#020c10 0%,#041820 100%)', bgSolid:'#020c10', genreLabel:'Time Travel',        marker:drawTimeMachine,accent:'#20c0e0', anim:'spin'     },
  military:   { roadTop:'#305020', bg:'linear-gradient(135deg,#060a04 0%,#0c1408 100%)', bgSolid:'#060a04', genreLabel:'Military Sci-Fi',    marker:drawMechSuit,   accent:'#60a030', anim:'stomp'    },
};

// ── Cursor drawing functions ──────────────────────────────────────────────────

// Hard Sci-Fi → Atom / molecular orbital model spinning
function drawAtom(g) {
  g.innerHTML = `<g>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="4.5" fill="#1060b0" stroke="#40a0ff" stroke-width="1.2" filter="url(#neon-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#60c0ff" opacity="0.9"/>
    <circle cx="-1" cy="-1" r="1" fill="#ffffff" opacity="0.6"/>
    <!-- Proton dots inside nucleus -->
    <circle cx="1"  cy="-1" r="0.8" fill="#ff6040" opacity="0.8"/>
    <circle cx="-1" cy="1"  r="0.8" fill="#ff6040" opacity="0.8"/>
    <!-- Orbital ring 1 (horizontal ellipse) -->
    <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#40a0ff" stroke-width="0.9" opacity="0.7"/>
    <!-- Orbital ring 2 (tilted 60°) -->
    <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#40a0ff" stroke-width="0.9" opacity="0.7" transform="rotate(60)"/>
    <!-- Orbital ring 3 (tilted 120°) -->
    <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#40a0ff" stroke-width="0.9" opacity="0.7" transform="rotate(120)"/>
    <!-- Electrons (one per orbit, placed around) -->
    <circle cx="16"  cy="0"   r="2.2" fill="#80d0ff" filter="url(#neon-glow)"/>
    <circle cx="-8"  cy="13.9" r="2.2" fill="#80d0ff" filter="url(#neon-glow)" transform="rotate(60)"/>
    <circle cx="-8"  cy="-13.9" r="2.2" fill="#80d0ff" filter="url(#neon-glow)" transform="rotate(120)"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="22" rx="8" ry="2" fill="rgba(30,100,220,0.18)"/>
  </g>`;
}

// Soft Sci-Fi → Friendly android / robot walking
function drawAndroid(g) {
  g.innerHTML = `<g>
    <!-- Antenna -->
    <line x1="0" y1="-22" x2="0" y2="-16" stroke="#40a0c0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="-23" r="2" fill="#00e8ff" filter="url(#neon-glow)"/>
    <!-- Head -->
    <rect x="-7" y="-16" width="14" height="12" rx="3" fill="#1a3a4a"/>
    <rect x="-7" y="-16" width="14" height="12" rx="3" fill="none" stroke="#40a0c0" stroke-width="1"/>
    <!-- Eyes (LED style) -->
    <rect x="-5" y="-13" width="4" height="3" rx="1" fill="#00e8ff" opacity="0.9"/>
    <rect x="1"  y="-13" width="4" height="3" rx="1" fill="#00e8ff" opacity="0.9"/>
    <!-- Mouth LED strip -->
    <rect x="-4" y="-8" width="8" height="1.5" rx="0.7" fill="#00e8ff" opacity="0.6"/>
    <!-- Neck -->
    <rect x="-2" y="-4" width="4" height="3" rx="1" fill="#142a38"/>
    <!-- Torso -->
    <rect x="-8" y="-1" width="16" height="14" rx="2" fill="#1a3a4a" stroke="#40a0c0" stroke-width="0.8"/>
    <!-- Chest panel detail -->
    <rect x="-5" y="1"  width="4" height="3" rx="1" fill="rgba(0,200,255,0.2)" stroke="#40a0c0" stroke-width="0.5"/>
    <rect x="1"  y="1"  width="4" height="3" rx="1" fill="rgba(0,200,255,0.2)" stroke="#40a0c0" stroke-width="0.5"/>
    <rect x="-3" y="5"  width="6" height="1.5" rx="0.5" fill="#00e8ff" opacity="0.5"/>
    <rect x="-3" y="7.5" width="6" height="1" rx="0.5" fill="#00e8ff" opacity="0.3"/>
    <!-- Arms -->
    <rect x="-12" y="0" width="4" height="10" rx="2" fill="#1a3a4a" stroke="#40a0c0" stroke-width="0.7"/>
    <rect x="8"   y="0" width="4" height="10" rx="2" fill="#1a3a4a" stroke="#40a0c0" stroke-width="0.7"/>
    <!-- Hands -->
    <circle cx="-10" cy="12" r="2.5" fill="#1a3a4a" stroke="#40a0c0" stroke-width="0.7"/>
    <circle cx="10"  cy="12" r="2.5" fill="#1a3a4a" stroke="#40a0c0" stroke-width="0.7"/>
    <!-- Legs (walking pose) -->
    <rect x="-6" y="13" width="4" height="9" rx="1.5" fill="#142a38" stroke="#40a0c0" stroke-width="0.7" transform="rotate(-8,-4,17)"/>
    <rect x="2"  y="13" width="4" height="9" rx="1.5" fill="#142a38" stroke="#40a0c0" stroke-width="0.7" transform="rotate(8,4,17)"/>
    <!-- Feet -->
    <ellipse cx="-5" cy="23" rx="4.5" ry="2" fill="#142a38" stroke="#40a0c0" stroke-width="0.7" transform="rotate(-8,-5,23)"/>
    <ellipse cx="5"  cy="22" rx="4.5" ry="2" fill="#142a38" stroke="#40a0c0" stroke-width="0.7" transform="rotate(8,5,22)"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="27" rx="9" ry="2.2" fill="rgba(0,160,200,0.18)"/>
  </g>`;
}

// Space Opera → Sleek spaceship flying (side view)
function drawSpaceship(g) {
  g.innerHTML = `<g>
    <!-- Engine glow trail -->
    <ellipse cx="-18" cy="2" rx="8" ry="3" fill="rgba(80,120,255,0.25)" filter="url(#neon-glow)"/>
    <ellipse cx="-14" cy="2" rx="4" ry="2" fill="rgba(120,160,255,0.5)"/>
    <ellipse cx="-11" cy="2" rx="2" ry="1.2" fill="#a0c0ff" opacity="0.9"/>
    <!-- Engine nozzle exhaust streaks -->
    <line x1="-12" y1="-1" x2="-24" y2="-4" stroke="#6080ff" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
    <line x1="-12" y1="2"  x2="-26" y2="2"  stroke="#8090ff" stroke-width="1"   opacity="0.6" stroke-linecap="round"/>
    <line x1="-12" y1="5"  x2="-24" y2="8"  stroke="#6080ff" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
    <!-- Main hull -->
    <path d="M18,2 Q10,-6 -4,-4 L-12,0 L-4,8 Q10,10 18,2 Z" fill="#1c2a5a"/>

    <line x1="2"  y1="4"  x2="6"  y2="4"  stroke="#4a7030" stroke-width="0.5" opacity="0.5"/>
    <!-- Arm hydraulics -->
    <rect x="-14" y="-4" width="5" height="14" rx="2" fill="#1a2810" stroke="#4a7030" stroke-width="0.8"/>
    <line x1="-11" y1="-3" x2="-11" y2="10" stroke="#60a040" stroke-width="0.6" opacity="0.5"/>
    <rect x="9"   y="-4" width="5" height="14" rx="2" fill="#1a2810" stroke="#4a7030" stroke-width="0.8"/>
    <line x1="12"  y1="-3" x2="12"  y2="10" stroke="#60a040" stroke-width="0.6" opacity="0.5"/>
    <!-- Gun arm (right — large barrel) -->
    <rect x="14" y="2" width="12" height="4" rx="1.5" fill="#0a1808" stroke="#60a040" stroke-width="0.8"/>
    <rect x="23" y="3" width="2"  height="2" rx="0.5" fill="#60c020" opacity="0.7" filter="url(#neon-glow)"/>
    <!-- Leg pistons (marching) -->
    <rect x="-7" y="6"  width="5" height="14" rx="2" fill="#1a2810" stroke="#4a7030" stroke-width="0.8" transform="rotate(-8,-4.5,13)"/>
    <rect x="2"  y="6"  width="5" height="14" rx="2" fill="#1a2810" stroke="#4a7030" stroke-width="0.8" transform="rotate(8,4.5,13)"/>
    <!-- Hydraulic pistons on legs -->
    <line x1="-4" y1="7"  x2="-4" y2="18" stroke="#60a040" stroke-width="0.6" opacity="0.5" transform="rotate(-8,-4,13)"/>
    <line x1="5"  y1="7"  x2="5"  y2="18" stroke="#60a040" stroke-width="0.6" opacity="0.5" transform="rotate(8,5,13)"/>
    <!-- Heavy boots -->
    <ellipse cx="-5" cy="21" rx="6" ry="3"   fill="#141e0c" stroke="#4a7030" stroke-width="0.8" transform="rotate(-8,-5,21)"/>
    <ellipse cx="5"  cy="20" rx="6" ry="3"   fill="#141e0c" stroke="#4a7030" stroke-width="0.8" transform="rotate(8,5,20)"/>
    <!-- Ground impact dust -->
    <ellipse cx="0"  cy="25" rx="12" ry="3"   fill="rgba(80,120,40,0.2)"/>
    <ellipse cx="-7" cy="23" rx="4"  ry="1.5" fill="rgba(80,120,40,0.15)"/>
    <ellipse cx="7"  cy="23" rx="4"  ry="1.5" fill="rgba(80,120,40,0.15)"/>
  </g>`;
}

// ── Core engine ───────────────────────────────────────────────────────────────
let pct = 42, currentSize = 'landscape', bgImage = null, celebrating = false, swayAnim = null, isPreview = false;

function getSVGPath() {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', PATH_D);
  return p;
}
function ptAt(t) {
  const p = getSVGPath();
  return p.getPointAtLength(p.getTotalLength() * Math.min(Math.max(t, 0), 1));
}
function togglePreview() {
  isPreview = !isPreview;
  document.body.classList.toggle('preview-mode', isPreview);
  const btn = document.getElementById('preview-btn');
  if (isPreview) { document.body.appendChild(btn); btn.textContent = '✕ exit'; }
  else { document.getElementById('panel').appendChild(btn); btn.textContent = '⛶ preview'; }
}

function applyGenreTheme() {
  const G = GENRES[document.getElementById('inp-genre').value];
  if (!bgImage) document.getElementById('canvas-wrap').style.background = G.bg;
  document.getElementById('road-border').setAttribute('stroke', 'rgba(0,0,0,0.4)');
  document.getElementById('road-border').setAttribute('stroke-width', '26');
  document.getElementById('road-border').setAttribute('d', PATH_D);
  document.getElementById('road-body').setAttribute('stroke', G.roadTop);
  document.getElementById('road-body').setAttribute('stroke-width', '18');
  document.getElementById('road-body').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('stroke', 'rgba(255,255,255,0.2)');
  document.getElementById('road-dash').setAttribute('stroke-width', '1.5');
  document.getElementById('road-dash').setAttribute('stroke-dasharray', '4 10');
  document.getElementById('svg-genre-label').textContent = G.genreLabel;
  document.querySelectorAll('#map-grid line').forEach(l => l.setAttribute('stroke', G.accent));
  document.querySelectorAll('#terrain-marks circle, #terrain-marks polyline, #terrain-marks line').forEach(el => {
    if (el.tagName === 'circle') el.setAttribute('fill', G.accent);
    else el.setAttribute('stroke', G.accent);
  });
}

function renderTitle(text) {
  const g = document.getElementById('title-group');
  g.innerHTML = '';
  const MAX_W = 158, MAX_FONT = 20, MIN_FONT = 12, LH = 1.28, START_Y = 28;
  const ns = 'http://www.w3.org/2000/svg';
  let chosenFont = MIN_FONT, chosenLines = [text];
  for (let fs = MAX_FONT; fs >= MIN_FONT; fs--) {
    const cpl = Math.floor(MAX_W / (fs * 0.56));
    const lines = wrapText(text, cpl);
    if (lines.length * fs * LH <= 54) { chosenFont = fs; chosenLines = lines; break; }
  }
  const el = document.createElementNS(ns, 'text');
  el.setAttribute('font-family', "'Courier New',Courier,monospace");
  el.setAttribute('font-size', chosenFont);
  el.setAttribute('font-weight', '700');
  el.setAttribute('fill', 'white');
  el.setAttribute('opacity', '0.96');
  el.setAttribute('filter', 'url(#soft-glow)');
  chosenLines.forEach((line, i) => {
    const ts = document.createElementNS(ns, 'tspan');
    ts.setAttribute('x', '16');
    ts.setAttribute('y', START_Y + i * chosenFont * LH);
    ts.textContent = line;
    el.appendChild(ts);
  });
  g.appendChild(el);
  return START_Y + (chosenLines.length - 1) * chosenFont * LH + chosenFont * 0.3;
}

function wrapText(text, cpl) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (t.length > cpl && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function updateTexts() {
  const titleText = document.getElementById('inp-title').value || 'Title';
  const authorText = document.getElementById('inp-author').value || 'Author';
  const genre = document.getElementById('inp-genre').value;
  const timeText = document.getElementById('inp-time').value || '';
  const bottomY = renderTitle(titleText);
  document.getElementById('svg-author').setAttribute('y', bottomY + 18);
  document.getElementById('svg-author').textContent = authorText;
  document.getElementById('svg-genre-label').setAttribute('y', bottomY + 34);
  document.getElementById('svg-genre-label').textContent = GENRES[genre].genreLabel;
  document.getElementById('svg-time').textContent = timeText;
  document.getElementById('svg-pct').textContent = pct + '%';
}

function startSway() {
  if (swayAnim) cancelAnimationFrame(swayAnim);
  let t0 = null;
  function frame(ts) {
    if (!t0) t0 = ts;
    const e = (ts - t0) / 1000;
    const anim = GENRES[document.getElementById('inp-genre').value].anim;
    const sway = document.getElementById('marker-sway');
    switch(anim) {
      case 'orbit':
        // Atom: continuous slow spin around nucleus axis
        sway.setAttribute('transform', `rotate(${e * 30 % 360})`);
        break;
      case 'walk':
        // Android walking: rhythmic bob + slight sway
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*3)*5}) translate(0,${Math.sin(e*3)*3})`);
        break;
      case 'soar':
        // Spaceship: smooth banking glide with subtle pitch
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.7)*10}) translate(${Math.sin(e*0.5)*4},${Math.sin(e*1.1)*5})`);
        break;
      case 'glitch':
        // Cyborg: occasional position snap (digital glitch effect)
        const gx = Math.round(Math.sin(e*8)*2)*1.5;
        const gy = Math.round(Math.cos(e*7)*1)*1.5;
        sway.setAttribute('transform',
          `translate(${gx},${gy}) rotate(${Math.sin(e*1.5)*4})`);
        break;
      case 'chug':
        // Airship: slow chug + propeller bob, gentle tilt
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*1.4)*8}) translate(0,${Math.sin(e*2.2)*4})`);
        break;
      case 'trudge':
        // Survivor/Scavenger: heavy slow walk, drag-step feel
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*2)*6}) translate(0,${Math.abs(Math.sin(e*2))*5})`);
        break;
      case 'spin':
        // Time machine: fast spin of clock vortex
        sway.setAttribute('transform',
          `rotate(${e * 60 % 360}) translate(0,${Math.sin(e*1.2)*3})`);
        break;
      case 'stomp':
        // Mech suit: heavy rhythmic stomp — sharp bob down on each step
        const stomp = Math.abs(Math.sin(e*2.5));
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*2.5)*5}) translate(0,${stomp*6})`);
        break;
      default:
        sway.setAttribute('transform', `rotate(${Math.sin(e*1.2)*6})`);
    }
    swayAnim = requestAnimationFrame(frame);
  }
  swayAnim = requestAnimationFrame(frame);
}

function placeMarker(scale = 1) {
  const pt = ptAt(pct / 100);
  document.getElementById('marker-anchor').setAttribute('transform', `translate(${pt.x},${pt.y})`);
  if (scale !== 1) document.getElementById('marker-sway').setAttribute('transform', `scale(${scale})`);
  const g = document.getElementById('marker-group');
  g.innerHTML = '';
  GENRES[document.getElementById('inp-genre').value].marker(g);
}

// Celebration: holographic data burst — glowing hex fragments + circuit sparks
function celebrate() {
  if (celebrating) return;
  celebrating = true;
  const cc = document.getElementById('confetti-container');
  cc.innerHTML = '';
  const colors = ['#00e8ff','#40c0ff','#80ff80','#ff4080','#ffcc00','#ffffff','#a040ff','#00ffb0'];
  const shapes = ['◈','⬡','▲','◆','✦','⬟','▸'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    const useShape = Math.random() > 0.4;
    const s = Math.random() * 7 + 3;
    if (useShape) {
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.cssText = `position:absolute;font-size:${s+5}px;color:${colors[i%colors.length]};left:${Math.random()*100}%;top:-16px;opacity:1;text-shadow:0 0 8px currentColor;font-family:monospace`;
    } else {
      el.style.cssText = `position:absolute;width:${s}px;height:${s}px;background:${colors[i%colors.length]};border-radius:${Math.random()>0.5?'0':'50%'};left:${Math.random()*100}%;top:-12px;opacity:1;box-shadow:0 0 8px currentColor`;
    }
    cc.appendChild(el);
    el.animate([
      { transform:'translateY(0) translateX(0) rotate(0deg) scale(1)', opacity:1 },
      { transform:`translateY(${Math.random()*260+40}px) translateX(${(Math.random()-.5)*180}px) rotate(${Math.random()*720}deg) scale(${Math.random()*0.4+0.1})`, opacity:0 }
    ], { duration: Math.random()*2000+1000, easing:'cubic-bezier(0.25,0.46,0.45,0.94)', fill:'forwards', delay: Math.random()*500 });
  }
  let fr = 0, growing = true, sc = 1;
  function pulse() {
    fr++;
    if (fr > 60) { placeMarker(1); celebrating = false; return; }
    sc = growing ? sc + 0.05 : sc - 0.04;
    if (sc > 2.0) growing = false;
    const pt = ptAt(1);
    document.getElementById('marker-anchor').setAttribute('transform', `translate(${pt.x},${pt.y})`);
    document.getElementById('marker-sway').setAttribute('transform', `scale(${sc})`);
    requestAnimationFrame(pulse);
  }
  requestAnimationFrame(pulse);
  setTimeout(() => cc.innerHTML = '', 4500);
}

document.getElementById('inp-pct').addEventListener('input', e => {
  pct = parseInt(e.target.value);
  document.getElementById('pct-label').textContent = pct + '%';
  celebrating = false;
  render();
  if (pct >= 100) setTimeout(celebrate, 300);
});
['inp-title','inp-author','inp-time'].forEach(id => document.getElementById(id).addEventListener('input', updateTexts));
document.getElementById('inp-genre').addEventListener('change', () => { celebrating = false; render(); startSway(); });
document.getElementById('file-in').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => { bgImage = ev.target.result; document.getElementById('bg-layer').style.backgroundImage = `url(${bgImage})`; document.getElementById('canvas-wrap').style.background = 'transparent'; };
  r.readAsDataURL(file);
});
function clearBg() { bgImage = null; document.getElementById('bg-layer').style.backgroundImage = ''; applyGenreTheme(); }
function setSize(k, btn) { currentSize = k; document.querySelectorAll('.sz').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
const SIZES = { 'landscape':{w:1080,h:566}, 'ig-post':{w:1080,h:1080}, 'ig-story':{w:1080,h:1920}, 'pinterest':{w:1000,h:1500} };

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function downloadImg() {
  const sz = SIZES[currentSize], genre = GENRES[document.getElementById('inp-genre').value];
  const canvas = document.createElement('canvas');
  canvas.width = sz.w; canvas.height = sz.h;
  const ctx = canvas.getContext('2d');
  ctx.save();
  roundRect(ctx,0,0,sz.w,sz.h,sz.w*0.04);
  ctx.clip();
  const clone = document.getElementById('main-svg').cloneNode(true);
  clone.setAttribute('width', sz.w); clone.setAttribute('height', sz.h);
  clone.setAttribute('viewBox', '0 0 380 280');
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));
  const img = new Image();
  img.onload = () => {
    if (!bgImage) { ctx.fillStyle = genre.bgSolid; ctx.fillRect(0,0,sz.w,sz.h); }
    ctx.drawImage(img,0,0,sz.w,sz.h);
    ctx.restore();
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = 'current-reading-scifi.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = url;
}

function render() { applyGenreTheme(); updateTexts(); placeMarker(); }
render(); startSway();
</script>
