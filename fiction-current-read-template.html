<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Reading Tracker — Fiction & Literature</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: #0e0b08; color: #eee; min-height: 100vh; }
#app { display: flex; min-height: 100vh; }
#panel { width: 250px; min-width: 220px; padding: 14px; border-right: 1px solid rgba(180,140,80,0.12); display: flex; flex-direction: column; gap: 10px; background: #120e0a; overflow-y: auto; }
#canvas-outer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0c0906; }
#canvas-wrap { position: relative; width: 380px; height: 280px; border-radius: 24px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 48px rgba(140,100,40,0.3); transition: all 0.4s ease; }
#bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; border-radius: 24px; }
#main-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px; }
body.preview-mode #panel { display: none; }
body.preview-mode #canvas-outer { background: #000; padding: 0; }
body.preview-mode #canvas-wrap { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
body.preview-mode #preview-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; opacity: 0.2; font-size: 10px; padding: 6px 14px; background: rgba(180,140,60,0.1); border: 1px solid rgba(180,140,60,0.25); border-radius: 20px; color: white; cursor: pointer; width: auto; }
body.preview-mode #preview-btn:hover { opacity: 0.8; }
label { font-size: 11px; color: #7a6040; display: block; margin-bottom: 3px; font-family: Georgia, serif; }
input[type=text], select { width: 100%; font-size: 12px; padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(180,140,60,0.15); background: rgba(160,120,40,0.07); color: #ddd; font-family: Georgia, serif; }
input[type=range] { width: 100%; accent-color: #c09040; }
.row { display: flex; gap: 8px; align-items: center; }
.pct-val { font-size: 12px; font-weight: 500; min-width: 36px; color: #eee; }
button { font-size: 11px; border: 1px solid rgba(180,140,60,0.15); border-radius: 8px; padding: 6px 8px; background: rgba(160,120,40,0.06); color: #ddd; cursor: pointer; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: Georgia, serif; }
button:hover { background: rgba(180,140,60,0.14); }
.sec { font-size: 10px; font-weight: 600; color: #5a4020; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; font-family: -apple-system, sans-serif; }
.size-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.sz { font-size: 10px; padding: 6px 4px; line-height: 1.3; text-align: center; white-space: normal; }
.sz.active { background: rgba(180,140,60,0.22); color: #d4a840; border-color: #c09040; }
.dl-btn { background: rgba(180,140,60,0.18) !important; color: #d4a840 !important; border-color: #c09040 !important; font-weight: 600; }
.hint { font-size: 10px; color: #5a4020; text-align: center; line-height: 1.5; margin-top: 2px; font-style: italic; }
#preview-btn { font-size: 10px; color: #4a3018; background: none; border: none; cursor: pointer; width: auto; text-align: center; padding: 2px; letter-spacing: 0.5px; margin-top: 2px; font-family: Georgia, serif; }
#preview-btn:hover { color: #8a6030; background: none; }
@media (max-width: 640px) {
  #app { flex-direction: column; }
  #panel { width: 100%; border-right: none; border-bottom: 1px solid rgba(180,140,60,0.1); }
  #canvas-outer { padding: 16px; }
  #canvas-wrap { width: 100%; max-width: 380px; height: auto; aspect-ratio: 380/280; }
}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <div style="font-size:14px;font-weight:700;color:#c09040;margin-bottom:4px;font-family:Georgia,serif;">📖 Current Reading</div>
    <div class="sec">Book Info</div>
    <div><label>Title</label><input type="text" id="inp-title" value="Normal People"></div>
    <div><label>Author</label><input type="text" id="inp-author" value="Sally Rooney"></div>
    <div><label>Subgenre</label>
      <select id="inp-genre">
        <option value="contemporary" selected>Contemporary Fiction</option>
        <option value="womens">Women's Fiction</option>
        <option value="historical">Historical Fiction</option>
        <option value="ya">Young Adult</option>
        <option value="comingofage">Coming of Age</option>
        <option value="familysaga">Family Saga</option>
        <option value="asian">Asian Literature</option>
        <option value="latinam">Latin American Literature</option>
        <option value="european">European Literature</option>
        <option value="african">African Literature</option>
      </select>
    </div>
    <div><label>Reading Time</label><input type="text" id="inp-time" value="2 hrs"></div>
    <div><label>Progress</label>
      <div class="row">
        <input type="range" id="inp-pct" min="0" max="100" value="61" style="flex:1">
        <span class="pct-val" id="pct-label">61%</span>
      </div>
    </div>
    <div class="sec">Background</div>
    <button onclick="document.getElementById('file-in').click()">Upload image</button>
    <input type="file" id="file-in" accept="image/*" style="display:none">
    <button onclick="clearBg()">Reset to default</button>
    <div class="sec">Download</div>
    <div class="size-btns">
      <button class="sz active" onclick="setSize('landscape',this)">1080 x 566</button>
      <button class="sz" onclick="setSize('ig-post',this)">1080 x 1080</button>
      <button class="sz" onclick="setSize('ig-story',this)">1080 x 1920</button>
      <button class="sz" onclick="setSize('pinterest',this)">1000 x 1500</button>
    </div>
    <button class="dl-btn" onclick="downloadImg()">Download PNG</button>
    <div class="hint">Slide to 100% to turn the last page ✨</div>
    <button id="preview-btn" onclick="togglePreview()">⛶ preview</button>
  </div>

  <div id="canvas-outer">
    <div id="canvas-wrap">
      <div id="bg-layer"></div>
      <div id="confetti-container"></div>
      <svg id="main-svg" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="warm-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="ink-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <clipPath id="title-clip"><rect x="10" y="8" width="165" height="120"/></clipPath>
        </defs>

        <!-- Literary map bg: aged paper / manuscript lines -->
        <g id="map-grid" opacity="0.10">
          <!-- Manuscript ruled lines (slightly irregular like old paper) -->
          <line x1="0"   y1="38"  x2="380" y2="40"  stroke="#c8a060" stroke-width="0.5"/>
          <line x1="0"   y1="76"  x2="380" y2="78"  stroke="#c8a060" stroke-width="0.5"/>
          <line x1="0"   y1="114" x2="380" y2="116" stroke="#c8a060" stroke-width="0.5"/>
          <line x1="0"   y1="152" x2="380" y2="154" stroke="#c8a060" stroke-width="0.5"/>
          <line x1="0"   y1="190" x2="380" y2="192" stroke="#c8a060" stroke-width="0.5"/>
          <line x1="0"   y1="228" x2="380" y2="230" stroke="#c8a060" stroke-width="0.5"/>
          <!-- Margin line (vertical, left side of page) -->
          <line x1="52"  y1="0"   x2="52"  y2="280" stroke="#c8a060" stroke-width="0.8"/>
          <line x1="160" y1="0"   x2="160" y2="280" stroke="#c8a060" stroke-width="0.4" opacity="0.5"/>
          <line x1="268" y1="0"   x2="268" y2="280" stroke="#c8a060" stroke-width="0.4" opacity="0.5"/>
          <line x1="350" y1="0"   x2="350" y2="280" stroke="#c8a060" stroke-width="0.4" opacity="0.5"/>
          <!-- Short horizontal margin notes (text simulation) -->
          <line x1="10" y1="48"  x2="44" y2="48"  stroke="#c8a060" stroke-width="0.6" opacity="0.7"/>
          <line x1="10" y1="58"  x2="38" y2="58"  stroke="#c8a060" stroke-width="0.6" opacity="0.5"/>
          <line x1="10" y1="122" x2="44" y2="122" stroke="#c8a060" stroke-width="0.6" opacity="0.7"/>
          <line x1="10" y1="132" x2="30" y2="132" stroke="#c8a060" stroke-width="0.6" opacity="0.5"/>
          <line x1="10" y1="196" x2="44" y2="196" stroke="#c8a060" stroke-width="0.6" opacity="0.7"/>
          <line x1="10" y1="206" x2="36" y2="206" stroke="#c8a060" stroke-width="0.6" opacity="0.5"/>
        </g>

        <!-- Literary terrain: small symbolic landmarks per literary world -->
        <g id="terrain-marks" opacity="0.09">
          <!-- Open books scattered -->
          <path d="M70,70 Q78,66 86,70 L86,82 Q78,78 70,82 Z" fill="#c8a060"/>
          <line x1="78" y1="66" x2="78" y2="82" stroke="#c8a060" stroke-width="0.8"/>
          <path d="M200,150 Q208,146 216,150 L216,162 Q208,158 200,162 Z" fill="#c8a060"/>
          <line x1="208" y1="146" x2="208" y2="162" stroke="#c8a060" stroke-width="0.8"/>
          <!-- Quill & inkwell -->
          <ellipse cx="300" cy="80" rx="5" ry="4" fill="#c8a060"/>
          <path d="M300,76 Q302,68 298,62 Q296,68 300,76 Z" fill="#c8a060"/>
          <!-- Small teacup -->
          <path d="M120,208 Q128,205 136,208 L134,218 Q128,220 122,218 Z" fill="#c8a060"/>
          <path d="M136,211 Q140,211 140,215 Q140,218 136,217" fill="none" stroke="#c8a060" stroke-width="1"/>
          <!-- Postcard / letter -->
          <rect x="260" y="195" width="22" height="16" rx="1" fill="#c8a060"/>
          <line x1="260" y1="199" x2="282" y2="207" stroke="#0c0906" stroke-width="0.7"/>
          <line x1="282" y1="199" x2="260" y2="207" stroke="#0c0906" stroke-width="0.7"/>
          <!-- Window (European / Asian architecture) -->
          <rect x="330" y="55"  width="16" height="22" rx="1"   fill="#c8a060"/>
          <rect x="332" y="57"  width="5"  height="8"  rx="0.5" fill="#0c0906"/>
          <rect x="340" y="57"  width="5"  height="8"  rx="0.5" fill="#0c0906"/>
          <rect x="335" y="67"  width="8"  height="8"  rx="0.5" fill="#0c0906"/>
          <polygon points="330,55 338,48 346,55" fill="#c8a060"/>
        </g>

        <!-- Reading path — gentle literary journey, like turning pages -->
        <path id="road-border" d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-body"   d="" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="road-dash"   d="" fill="none" stroke-linecap="round"/>

        <!-- Start: open first page -->
        <g transform="translate(28,245)">
          <path d="M-6,-8 Q0,-10 6,-8 L6,6 Q0,4 -6,6 Z" fill="rgba(180,140,60,0.2)" stroke="rgba(200,160,80,0.65)" stroke-width="1.1"/>
          <line x1="0" y1="-10" x2="0" y2="6" stroke="rgba(200,160,80,0.6)" stroke-width="0.8"/>
          <text x="12" y="4" font-size="7.5" fill="rgba(255,255,255,0.38)" font-family="Georgia,serif" font-style="italic">ch. i</text>
        </g>

        <!-- End: golden bookmark / last page -->
        <g transform="translate(342,30)" filter="url(#warm-glow)">
          <polygon points="0,-9 5,2 0,-1 -5,2" fill="rgba(210,170,60,0.8)" stroke="rgba(230,190,80,0.9)" stroke-width="1"/>
          <circle cx="0" cy="-9" r="2" fill="#f0c840" opacity="0.9"/>
          <text x="12" y="4" font-size="7.5" fill="rgba(255,255,255,0.38)" font-family="Georgia,serif" font-style="italic">fin</text>
        </g>

        <!-- Compass: ink nib style -->
        <g transform="translate(355,255)" opacity="0.2">
          <circle cx="0" cy="0" r="13" fill="none" stroke="#c8a060" stroke-width="0.8"/>
          <circle cx="0" cy="0" r="3"  fill="rgba(180,140,60,0.3)"/>
          <line x1="0" y1="-11" x2="0"   y2="11"  stroke="#c8a060" stroke-width="0.8"/>
          <line x1="-11" y1="0" x2="11"  y2="0"   stroke="#c8a060" stroke-width="0.8"/>
          <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"  stroke="#c8a060" stroke-width="0.35"/>
          <line x1="7.8"  y1="-7.8" x2="-7.8" y2="7.8" stroke="#c8a060" stroke-width="0.35"/>
          <polygon points="0,-11 -2,-4 2,-4" fill="#c8a060"/>
          <text x="0" y="-14" font-size="5" fill="#c8a060" text-anchor="middle" font-family="Georgia,serif">N</text>
        </g>

        <g clip-path="url(#title-clip)">
          <g id="title-group"></g>
          <text id="svg-author" x="16" y="999" font-family="Georgia,serif" font-size="11" font-style="italic" fill="rgba(255,255,255,0.70)">Sally Rooney</text>
          <text id="svg-genre-label" x="16" y="999" font-family="Georgia,serif" font-size="9" fill="rgba(200,160,80,0.6)" font-style="italic">Contemporary Fiction</text>
        </g>
        <text id="svg-time" x="295" y="195" font-family="Georgia,serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.80)" text-anchor="middle" filter="url(#soft-glow)">2 hrs</text>
        <text id="svg-pct"  x="295" y="250" font-family="Georgia,serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" opacity="0.95" filter="url(#soft-glow)">61%</text>
        <g id="marker-anchor"><g id="marker-sway"><g id="marker-group"></g></g></g>
      </svg>
    </div>
  </div>
</div>

<script>
// Path — gentle long arc like a leisurely reading afternoon
const PATH_D = "M 28 245 C 54 228, 76 214, 106 194 C 132 176, 148 156, 176 134 C 202 114, 224 106, 252 84 C 274 66, 310 46, 342 30";

// ── Genre config ──────────────────────────────────────────────────────────────
const GENRES = {
  contemporary: { roadTop:'#6a5030', bg:'linear-gradient(135deg,#120e08 0%,#1e1610 100%)', bgSolid:'#120e08', genreLabel:'Contemporary Fiction', marker:drawCoffeeCup,   accent:'#c09040', anim:'steam'    },
  womens:       { roadTop:'#7a3050', bg:'linear-gradient(135deg,#140810 0%,#200e18 100%)', bgSolid:'#140810', genreLabel:"Women's Fiction",       marker:drawPeonies,     accent:'#d06090', anim:'bloom'    },
  historical:   { roadTop:'#5a4020', bg:'linear-gradient(135deg,#100c06 0%,#1a1208 100%)', bgSolid:'#100c06', genreLabel:'Historical Fiction',     marker:drawScrollMap,   accent:'#b08040', anim:'drift'    },
  ya:           { roadTop:'#405080', bg:'linear-gradient(135deg,#08100e 0%,#101a18 100%)', bgSolid:'#08100e', genreLabel:'Young Adult',            marker:drawBackpack,    accent:'#6090c0', anim:'bounce'   },
  comingofage:  { roadTop:'#486030', bg:'linear-gradient(135deg,#0a0e06 0%,#121808 100%)', bgSolid:'#0a0e06', genreLabel:'Coming of Age',          marker:drawBicycle,     accent:'#70a040', anim:'pedal'    },
  familysaga:   { roadTop:'#603828', bg:'linear-gradient(135deg,#120a06 0%,#1e1008 100%)', bgSolid:'#120a06', genreLabel:'Family Saga',            marker:drawFamilyTree,  accent:'#b06040', anim:'sway'     },
  asian:        { roadTop:'#5a3040', bg:'linear-gradient(135deg,#100808 0%,#1a0e10 100%)', bgSolid:'#100808', genreLabel:'Asian Literature',       marker:drawLantern,     accent:'#c05060', anim:'float'    },
  latinam:      { roadTop:'#704020', bg:'linear-gradient(135deg,#120a04 0%,#1e1006 100%)', bgSolid:'#120a04', genreLabel:'Latin American Lit.',    marker:drawMarigold,    accent:'#e08030', anim:'spin'     },
  european:     { roadTop:'#405060', bg:'linear-gradient(135deg,#080c10 0%,#101420 100%)', bgSolid:'#080c10', genreLabel:'European Literature',    marker:drawCathedral,   accent:'#608090', anim:'toll'     },
  african:      { roadTop:'#704830', bg:'linear-gradient(135deg,#100a04 0%,#1e1008 100%)', bgSolid:'#100a04', genreLabel:'African Literature',     marker:drawBaobab,      accent:'#c07840', anim:'breathe'  },
};

// ── Cursor drawing functions ──────────────────────────────────────────────────

// Contemporary Fiction → Coffee cup with rising steam — reading café vibes
function drawCoffeeCup(g) {
  g.innerHTML = `<g>
    <!-- Steam wisps (top) -->
    <path d="M-3,-16 Q-5,-20 -3,-24 Q-1,-20 -3,-16" fill="none" stroke="#d0b080" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M2,-14  Q0,-19  2,-23  Q4,-19  2,-14"  fill="none" stroke="#d0b080" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M7,-16  Q5,-21  7,-25  Q9,-21  7,-16"  fill="none" stroke="#d0b080" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Cup body -->
    <path d="M-10,-12 Q-11,2 -8,10 L8,10 Q11,2 10,-12 Z" fill="#1e1408" stroke="#c09040" stroke-width="1.2"/>
    <!-- Coffee surface (dark liquid) -->
    <ellipse cx="0" cy="-11" rx="9.5" ry="3" fill="#2a1a08"/>
    <ellipse cx="0" cy="-11" rx="7"   ry="2" fill="#3a2210" opacity="0.8"/>
    <!-- Latte art (simple heart) -->
    <path d="M-2,-11 Q-4,-13 -2,-12 Q0,-10 2,-12 Q4,-13 2,-11 Q0,-9 -2,-11 Z" fill="#7a5030" opacity="0.7"/>
    <!-- Cup handle -->
    <path d="M10,-4 Q16,-4 16,2 Q16,8 10,8" fill="none" stroke="#c09040" stroke-width="2" stroke-linecap="round"/>
    <!-- Saucer -->
    <ellipse cx="0" cy="11" rx="13" ry="3.5" fill="#1a1206" stroke="#c09040" stroke-width="1"/>
    <ellipse cx="0" cy="11" rx="9"  ry="2"   fill="#241808"/>
    <!-- Saucer rim detail -->
    <ellipse cx="0" cy="11" rx="13" ry="3.5" fill="none" stroke="#e0b050" stroke-width="0.5" opacity="0.5"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="17" rx="12" ry="2.5" fill="rgba(180,130,40,0.18)"/>
  </g>`;
}

// Women's Fiction → Full bloom peony flower — lush, soft, layered
function drawPeonies(g) {
  g.innerHTML = `<g>
    <!-- Outer petals (large, round, layered) -->
    <ellipse cx="0"    cy="-12" rx="6"  ry="10" fill="#c05070" opacity="0.8"/>
    <ellipse cx="10"   cy="-6"  rx="6"  ry="10" fill="#c05070" opacity="0.8" transform="rotate(72,10,-6)"/>
    <ellipse cx="6.2"  cy="7"   rx="6"  ry="10" fill="#c05070" opacity="0.8" transform="rotate(144,6.2,7)"/>
    <ellipse cx="-6.2" cy="7"   rx="6"  ry="10" fill="#c05070" opacity="0.8" transform="rotate(216,-6.2,7)"/>
    <ellipse cx="-10"  cy="-6"  rx="6"  ry="10" fill="#c05070" opacity="0.8" transform="rotate(288,-10,-6)"/>
    <!-- Mid petals (brighter inner layer) -->
    <ellipse cx="0"   cy="-9"  rx="4.5" ry="7.5" fill="#e07090" opacity="0.85"/>
    <ellipse cx="7.5" cy="-4"  rx="4.5" ry="7.5" fill="#e07090" opacity="0.85" transform="rotate(72,7.5,-4)"/>
    <ellipse cx="4.6" cy="5"   rx="4.5" ry="7.5" fill="#e07090" opacity="0.85" transform="rotate(144,4.6,5)"/>
    <ellipse cx="-4.6" cy="5"  rx="4.5" ry="7.5" fill="#e07090" opacity="0.85" transform="rotate(216,-4.6,5)"/>
    <ellipse cx="-7.5" cy="-4" rx="4.5" ry="7.5" fill="#e07090" opacity="0.85" transform="rotate(288,-7.5,-4)"/>
    <!-- Inner petals (tightest, palest) -->
    <ellipse cx="0"    cy="-6"  rx="3"  ry="5" fill="#f090a8" opacity="0.9"/>
    <ellipse cx="4.8"  cy="-2"  rx="3"  ry="5" fill="#f090a8" opacity="0.9" transform="rotate(72,4.8,-2)"/>
    <ellipse cx="3"    cy="3.5" rx="3"  ry="5" fill="#f090a8" opacity="0.9" transform="rotate(144,3,3.5)"/>
    <ellipse cx="-3"   cy="3.5" rx="3"  ry="5" fill="#f090a8" opacity="0.9" transform="rotate(216,-3,3.5)"/>
    <ellipse cx="-4.8" cy="-2"  rx="3"  ry="5" fill="#f090a8" opacity="0.9" transform="rotate(288,-4.8,-2)"/>
    <!-- Golden stamens center -->
    <circle cx="0" cy="0" r="4.5" fill="#f0c030" opacity="0.95"/>
    <circle cx="0" cy="0" r="3"   fill="#f8d840"/>
    <circle cx="-1.5" cy="-1.5" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- Stamen dots -->
    <circle cx="2"    cy="-2"  r="0.6" fill="#e0a020" opacity="0.8"/>
    <circle cx="-2"   cy="1.5" r="0.6" fill="#e0a020" opacity="0.8"/>
    <circle cx="1.5"  cy="2.5" r="0.6" fill="#e0a020" opacity="0.8"/>
    <!-- Stem -->
    <path d="M0,14 Q-3,20 -2,26" fill="none" stroke="#508040" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M-1,18 Q-8,14 -12,16 Q-8,20 -2,20 Z" fill="#508040" opacity="0.8"/>
    <path d="M-1.5,22 Q6,18 10,20 Q7,24 0,24 Z"   fill="#508040" opacity="0.7"/>
    <!-- Shadow -->
    <ellipse cx="0" cy="29" rx="8" ry="2.5" fill="rgba(200,80,120,0.18)"/>
  </g>`;
}

// Historical Fiction → Rolled scroll / ancient map with wax seal
function drawScrollMap(g) {
  g.innerHTML = `<g>
    <!-- Scroll rolled top -->
    <ellipse cx="0" cy="-16" rx="10" ry="3.5" fill="#c8a060" stroke="#a07830" stroke-width="1"/>

    <path d="M-6,26  Q-8,28  -6,32"  fill="none" stroke="#7a4820" stroke-width="2"   stroke-linecap="round"/>
    <path d="M6,26   Q8,28   6,32"   fill="none" stroke="#7a4820" stroke-width="2"   stroke-linecap="round"/>
    <path d="M12,24  Q18,26  22,30"  fill="none" stroke="#7a4820" stroke-width="3"   stroke-linecap="round"/>
    <!-- Wide spreading branches (many, irregular — baobab "roots in the sky") -->
    <path d="M0,0  Q-10,-6  -18,-12" fill="none" stroke="#8a5020" stroke-width="3"   stroke-linecap="round"/>
    <path d="M0,0  Q10,-6   18,-12"  fill="none" stroke="#8a5020" stroke-width="3"   stroke-linecap="round"/>
    <path d="M0,0  Q0,-10   0,-18"   fill="none" stroke="#8a5020" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-10,-6  Q-18,-10 -22,-8"  fill="none" stroke="#7a4010" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10,-6  Q-16,-14 -14,-18" fill="none" stroke="#7a4010" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M10,-6   Q18,-10  22,-8"   fill="none" stroke="#7a4010" stroke-width="2" stroke-linecap="round"/>
    <path d="M10,-6   Q16,-14  14,-18"  fill="none" stroke="#7a4010" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,-12   Q-8,-18  -8,-24"  fill="none" stroke="#6a3808" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-12   Q8,-18   8,-24"   fill="none" stroke="#6a3808" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sparse dry-season leaves (small clusters at branch tips) -->
    <circle cx="-20" cy="-10" r="3.5" fill="#7a5820" opacity="0.8"/>
    <circle cx="-16" cy="-20" r="3"   fill="#7a5820" opacity="0.7"/>
    <circle cx="-10" cy="-25" r="2.5" fill="#8a6828" opacity="0.8"/>
    <circle cx="0"   cy="-20" r="4"   fill="#7a5820" opacity="0.9"/>
    <circle cx="10"  cy="-25" r="2.5" fill="#8a6828" opacity="0.8"/>
    <circle cx="16"  cy="-20" r="3"   fill="#7a5820" opacity="0.7"/>
    <circle cx="20"  cy="-10" r="3.5" fill="#7a5820" opacity="0.8"/>
    <!-- Orange-warm dust / savannah sky glow at base -->
    <ellipse cx="0" cy="30" rx="16" ry="4" fill="rgba(200,140,40,0.18)" filter="url(#warm-glow)"/>
    <!-- Golden sun disk behind tree (semi-hidden) -->
    <circle cx="6" cy="-8" r="7" fill="rgba(240,160,40,0.1)" filter="url(#warm-glow)"/>
  </g>`;
}

// ── Core engine ───────────────────────────────────────────────────────────────
let pct = 61, currentSize = 'landscape', bgImage = null, celebrating = false, swayAnim = null, isPreview = false;

function getSVGPath() {
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', PATH_D);
  return p;
}
function ptAt(t) {
  const p = getSVGPath();
  return p.getPointAtLength(p.getTotalLength() * Math.min(Math.max(t,0),1));
}
function togglePreview() {
  isPreview = !isPreview;
  document.body.classList.toggle('preview-mode', isPreview);
  const btn = document.getElementById('preview-btn');
  if (isPreview) { document.body.appendChild(btn); btn.textContent = '✕ exit'; }
  else { document.getElementById('panel').appendChild(btn); btn.textContent = '⛶ preview'; }
}

function applyGenreTheme() {
  const G = GENRES[document.getElementById('inp-genre').value];
  if (!bgImage) document.getElementById('canvas-wrap').style.background = G.bg;
  document.getElementById('road-border').setAttribute('stroke','rgba(0,0,0,0.4)');
  document.getElementById('road-border').setAttribute('stroke-width','24');
  document.getElementById('road-border').setAttribute('d', PATH_D);
  document.getElementById('road-body').setAttribute('stroke', G.roadTop);
  document.getElementById('road-body').setAttribute('stroke-width','16');
  document.getElementById('road-body').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('d', PATH_D);
  document.getElementById('road-dash').setAttribute('stroke','rgba(255,255,255,0.18)');
  document.getElementById('road-dash').setAttribute('stroke-width','1.2');
  document.getElementById('road-dash').setAttribute('stroke-dasharray','5 11');
  document.getElementById('svg-genre-label').textContent = G.genreLabel;
  document.querySelectorAll('#map-grid line').forEach(l => l.setAttribute('stroke', G.accent));
  document.querySelectorAll('#terrain-marks *').forEach(el => {
    if (el.tagName === 'line' || el.tagName === 'path') el.setAttribute('stroke', G.accent);
    else el.setAttribute('fill', G.accent);
  });
}

function renderTitle(text) {
  const g = document.getElementById('title-group');
  g.innerHTML = '';
  const MAX_W=158, MAX_FONT=20, MIN_FONT=12, LH=1.28, START_Y=28;
  const ns='http://www.w3.org/2000/svg';
  let chosenFont=MIN_FONT, chosenLines=[text];
  for (let fs=MAX_FONT; fs>=MIN_FONT; fs--) {
    const cpl=Math.floor(MAX_W/(fs*0.56));
    const lines=wrapText(text,cpl);
    if (lines.length*fs*LH<=54) { chosenFont=fs; chosenLines=lines; break; }
  }
  const el=document.createElementNS(ns,'text');
  el.setAttribute('font-family','Georgia,serif');
  el.setAttribute('font-size',chosenFont);
  el.setAttribute('font-weight','700');
  el.setAttribute('fill','white');
  el.setAttribute('opacity','0.95');
  el.setAttribute('filter','url(#soft-glow)');
  chosenLines.forEach((line,i)=>{
    const ts=document.createElementNS(ns,'tspan');
    ts.setAttribute('x','16');
    ts.setAttribute('y', START_Y + i*chosenFont*LH);
    ts.textContent=line;
    el.appendChild(ts);
  });
  g.appendChild(el);
  return START_Y+(chosenLines.length-1)*chosenFont*LH+chosenFont*0.3;
}

function wrapText(text,cpl) {
  const words=text.split(' '),lines=[];
  let cur='';
  for (const w of words) {
    const t=cur?cur+' '+w:w;
    if (t.length>cpl&&cur){lines.push(cur);cur=w;}else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}

function updateTexts() {
  const titleText=document.getElementById('inp-title').value||'Title';
  const authorText=document.getElementById('inp-author').value||'Author';
  const genre=document.getElementById('inp-genre').value;
  const timeText=document.getElementById('inp-time').value||'';
  const bottomY=renderTitle(titleText);
  document.getElementById('svg-author').setAttribute('y', bottomY+18);
  document.getElementById('svg-author').textContent=authorText;
  document.getElementById('svg-genre-label').setAttribute('y', bottomY+34);
  document.getElementById('svg-genre-label').textContent=GENRES[genre].genreLabel;
  document.getElementById('svg-time').textContent=timeText;
  document.getElementById('svg-pct').textContent=pct+'%';
}

function startSway() {
  if(swayAnim) cancelAnimationFrame(swayAnim);
  let t0=null;
  function frame(ts) {
    if(!t0) t0=ts;
    const e=(ts-t0)/1000;
    const anim=GENRES[document.getElementById('inp-genre').value].anim;
    const sway=document.getElementById('marker-sway');
    switch(anim) {
      case 'steam':
        // Coffee cup: very gentle warmth rock — like steam rising
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.8)*5}) translate(0,${Math.sin(e*1.4)*2})`);
        break;
      case 'bloom':
        // Peony: slow pulse open/close + gentle sway — like a flower in breeze
        const bs=1+Math.sin(e*1.6)*0.1;
        sway.setAttribute('transform',`scale(${bs}) rotate(${Math.sin(e*0.9)*6})`);
        break;
      case 'drift':
        // Scroll: slow lazy unrolling drift — like parchment on a desk
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.7)*8}) translate(${Math.sin(e*0.5)*3},${Math.sin(e*1.1)*2})`);
        break;
      case 'bounce':
        // Backpack: bouncy teen walk — snappy bob
        const bb=Math.abs(Math.sin(e*3.5))*5;
        sway.setAttribute('transform',
          `translate(0,${-bb}) rotate(${Math.sin(e*3.5)*6})`);
        break;
      case 'pedal':
        // Bicycle: rolling rhythm — side rock as it pedals
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*2.8)*7}) translate(0,${Math.sin(e*2.8)*3})`);
        break;
      case 'sway':
        // Family tree: slow deep sway in wind — ancient, patient
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.6)*10}) translate(0,${Math.sin(e*1.2)*2})`);
        break;
      case 'float':
        // Lantern: gentle floating upward drift + slow rotation
        sway.setAttribute('transform',
          `translate(${Math.sin(e*0.9)*4},${Math.sin(e*0.7)*-5}) rotate(${Math.sin(e*1.1)*8})`);
        break;
      case 'spin':
        // Marigold: slow joyful rotation — Day of the Dead spin
        sway.setAttribute('transform',
          `rotate(${e*18 % 360}) scale(${1+Math.sin(e*2)*0.07})`);
        break;
      case 'toll':
        // Cathedral: slow bell-toll pendulum — solemn, weighty
        sway.setAttribute('transform',
          `rotate(${Math.sin(e*0.5)*12}) translate(0,${Math.sin(e*1)*1})`);
        break;
      case 'breathe':
        // Baobab: ancient breathing — barely perceptible scale pulse
        const bx=1+Math.sin(e*0.8)*0.06;
        const by=1+Math.cos(e*0.6)*0.08;
        sway.setAttribute('transform',`scale(${bx},${by}) rotate(${Math.sin(e*1.4)*4})`);
        break;
      default:
        sway.setAttribute('transform',`rotate(${Math.sin(e*1.2)*6})`);
    }
    swayAnim=requestAnimationFrame(frame);
  }
  swayAnim=requestAnimationFrame(frame);
}

function placeMarker(scale=1) {
  const pt=ptAt(pct/100);
  document.getElementById('marker-anchor').setAttribute('transform',`translate(${pt.x},${pt.y})`);
  if(scale!==1) document.getElementById('marker-sway').setAttribute('transform',`scale(${scale})`);
  const g=document.getElementById('marker-group');
  g.innerHTML='';
  GENRES[document.getElementById('inp-genre').value].marker(g);
}

// Celebration: literary confetti — petals, paper pages, golden letters
function celebrate() {
  if(celebrating) return;
  celebrating=true;
  const cc=document.getElementById('confetti-container');
  cc.innerHTML='';
  const colors=['#d4a840','#e07090','#70a040','#c05060','#e08030','#6090c0','#c09040','#ffffff','#f0c020'];
  const shapes=['❧','✦','◆','❀','✿','❁','◈','§','✾'];
  for (let i=0; i<80; i++) {
    const el=document.createElement('div');
    const useShape=Math.random()>0.4, s=Math.random()*7+3;
    if(useShape) {
      el.textContent=shapes[Math.floor(Math.random()*shapes.length)];
      el.style.cssText=`position:absolute;font-size:${s+6}px;color:${colors[i%colors.length]};left:${Math.random()*100}%;top:-16px;opacity:1;text-shadow:0 0 6px currentColor;font-family:Georgia,serif`;
    } else {
      // Petal / paper shape
      const isPetal=Math.random()>0.5;
      el.style.cssText=`position:absolute;width:${s*2}px;height:${s}px;background:${colors[i%colors.length]};border-radius:${isPetal?'50% 0 50% 0':'2px'};left:${Math.random()*100}%;top:-12px;opacity:0.9;box-shadow:0 0 4px ${colors[i%colors.length]}44`;
    }
    cc.appendChild(el);
    el.animate([
      { transform:'translateY(0) translateX(0) rotate(0deg) scale(1)', opacity:0.9 },
      { transform:`translateY(${Math.random()*260+40}px) translateX(${(Math.random()-.5)*180}px) rotate(${Math.random()*720}deg) scale(${Math.random()*0.4+0.1})`, opacity:0 }
    ],{ duration:Math.random()*2600+1200, easing:'cubic-bezier(0.25,0.46,0.45,0.94)', fill:'forwards', delay:Math.random()*700 });
  }
  let fr=0, growing=true, sc=1;
  function pulse() {
    fr++;
    if(fr>60){placeMarker(1);celebrating=false;return;}
    sc=growing?sc+0.05:sc-0.04;
    if(sc>2.0) growing=false;
    const pt=ptAt(1);
    document.getElementById('marker-anchor').setAttribute('transform',`translate(${pt.x},${pt.y})`);
    document.getElementById('marker-sway').setAttribute('transform',`scale(${sc})`);
    requestAnimationFrame(pulse);
  }
  requestAnimationFrame(pulse);
  setTimeout(()=>cc.innerHTML='',5000);
}

document.getElementById('inp-pct').addEventListener('input',e=>{
  pct=parseInt(e.target.value);
  document.getElementById('pct-label').textContent=pct+'%';
  celebrating=false;
  render();
  if(pct>=100) setTimeout(celebrate,300);
});
['inp-title','inp-author','inp-time'].forEach(id=>document.getElementById(id).addEventListener('input',updateTexts));
document.getElementById('inp-genre').addEventListener('change',()=>{celebrating=false;render();startSway();});
document.getElementById('file-in').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{bgImage=ev.target.result;document.getElementById('bg-layer').style.backgroundImage=`url(${bgImage})`;document.getElementById('canvas-wrap').style.background='transparent';};
  r.readAsDataURL(file);
});
function clearBg(){bgImage=null;document.getElementById('bg-layer').style.backgroundImage='';applyGenreTheme();}
function setSize(k,btn){currentSize=k;document.querySelectorAll('.sz').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
const SIZES={'landscape':{w:1080,h:566},'ig-post':{w:1080,h:1080},'ig-story':{w:1080,h:1920},'pinterest':{w:1000,h:1500}};

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function downloadImg(){
  const sz=SIZES[currentSize],genre=GENRES[document.getElementById('inp-genre').value];
  const canvas=document.createElement('canvas');
  canvas.width=sz.w;canvas.height=sz.h;
  const ctx=canvas.getContext('2d');
  ctx.save();
  roundRect(ctx,0,0,sz.w,sz.h,sz.w*0.04);
  ctx.clip();
  const clone=document.getElementById('main-svg').cloneNode(true);
  clone.setAttribute('width',sz.w);clone.setAttribute('height',sz.h);
  clone.setAttribute('viewBox','0 0 380 280');
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}));
  const img=new Image();
  img.onload=()=>{
    if(!bgImage){ctx.fillStyle=genre.bgSolid;ctx.fillRect(0,0,sz.w,sz.h);}
    ctx.drawImage(img,0,0,sz.w,sz.h);
    ctx.restore();
    URL.revokeObjectURL(url);
    const a=document.createElement('a');
    a.download='current-reading-fiction.png';
    a.href=canvas.toDataURL('image/png');
    a.click();
  };
  img.src=url;
}

function render(){applyGenreTheme();updateTexts();placeMarker();}
render();startSway();
</script>
